id: insecure-session-management
title: Insecure Session Management
function: architecture
stride: spoofing
finding_class: control-not-evidenced
cwe: 613
description: >
  The frontend application issues session tokens without enforcing secure handling, such as missing
  Secure or HttpOnly flags, excessive lifetimes, or no re-authentication before sensitive actions.
impact: >
  If this risk remains unmitigated, a stolen or fixated session token grants an attacker
  authenticated access to the application for as long as the token remains valid.
asvs: "V3 - Session Management"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"
action: 'Enforce the Secure and HttpOnly cookie flags, implement absolute and idle session timeouts, and rotate session tokens on authentication events.'
mitigation: >
  Set the Secure and HttpOnly flags on every session cookie, and set SameSite=Strict or SameSite=Lax
  to mitigate CSRF. Additionally, implement both an absolute session timeout and an idle timeout.
  Rotate session tokens immediately after a successful authentication and after any privilege
  escalation. Finally, require re-authentication for sensitive operations. References include NIST
  SP 800-53 AC-12 (Session Termination), the DISA Application Security and Development STIG
  (APSC-DV-001460 and APSC-DV-001480), and OWASP ASVS V3.
check: 'Has the session management configuration been audited and confirmed to enforce the Secure, HttpOnly, and SameSite flags, timeouts, and token rotation?'
detection_logic: >
  Run DAST tools with session management checks against every login and authenticated endpoint, and
  check the Set-Cookie response headers for the Secure, HttpOnly, and SameSite attributes.
  Additionally, monitor the authentication logs for sessions that exceed the configured absolute
  timeout.
risk_assessment: >
  Medium. However, the finding rises to High if session tokens have no expiry or are transmitted
  over HTTP, or if administrator sessions are affected.
false_positives: >
  This rule fires on every in-scope frontend asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once the
  session management configuration is confirmed to enforce the Secure, HttpOnly, and SameSite flags,
  idle and absolute timeouts, and token rotation on authentication events. Threagile's built-in
  session-id-using-shared-secret rule may raise a partially overlapping finding. However, this
  category is not a duplicate, since it provides broader, STIG-aligned session management coverage,
  including the timeout and re-authentication requirements.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.frontend_related}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Insecure Session Management</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: medium baseline plus the CIA step on I (STRIDE spoofing).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
