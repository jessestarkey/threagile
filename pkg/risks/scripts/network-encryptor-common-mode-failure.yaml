id: network-encryptor-common-mode-failure
title: "CSfC Network Encryptor Common-Mode Failure and Red/Black Boundary Collapse"
function: architecture
stride: information-disclosure
cwe: 653
description: >
  A CSfC-approved network encryption architecture requires two independent encryption layers
  built from diverse components so that a flaw in one layer alone cannot expose plaintext
  (red) traffic to the untrusted (black) side. A collapsed single layer, or two layers sharing
  a vendor, codebase, or vulnerability, defeats that independence requirement without any
  outward sign of failure.
impact: >
  If this risk remains unmitigated, a single flaw common to both encryption layers -- or a
  deployment that silently runs only one layer -- lets classified or CUI plaintext cross the
  red/black boundary with the same apparent assurance as a properly layered deployment.
asvs: "V9 - Communications"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html"
action: "Confirm the two required encryption layers are built from diverse, independently-sourced components with no shared vendor, codebase, or known common vulnerability."
mitigation: >
  Verify both encryption layers required by the CSfC Capability Package are actually present
  and independently keyed -- not a single layer misconfigured to appear as two, and not two
  layers sourced from the same vendor or sharing underlying code that a single vulnerability
  could defeat both at once. Periodically re-verify this independence, since a hardware
  replacement, firmware update, or configuration change after initial accreditation could
  silently collapse the two layers into one without any functional symptom. Maintain
  documented key management and rotation for each layer separately. References: NSA
  Commercial Solutions for Classified (CSfC) Customer Handbook; NIST SP 800-53 SC-8
  (Transmission Confidentiality and Integrity); NIST SP 800-53 SC-13 (Cryptographic
  Protection).
check: "Are the two required CSfC encryption layers independently sourced and keyed with no shared vendor, codebase, or known common vulnerability, and is that independence periodically re-verified?"
detection_logic: >
  Audit the encryption architecture's documentation and configuration for evidence both
  required layers are present, independently keyed, and sourced from diverse components.
  Confirm a recurring re-verification process exists, distinct from one-time initial
  accreditation.
risk_assessment: >
  Critical for any CSfC-architected transport whose two-layer independence has not been
  verified since initial accreditation, or where both layers share a vendor or codebase.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope network-encryptor
  asset, by design). Dispose of a confirmed-compliant asset through risk_tracking instead: log
  it as mitigated once two-layer independence is confirmed and a recurring re-verification
  process is in place.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.network-encryptor}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>CSfC Network Encryptor Common-Mode Failure and Red/Black Boundary Collapse</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "unlikely" (the floor) -- a properly accredited CSfC deployment is assumed
    # correct absent a specific reason to doubt it, so only the upward (RAA >= 40) delta is
    # reachable.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            equal-or-greater:
              first: "{tech_asset.raa}"
              second: 40
            then:
              - return: possible
            else:
              - return: unlikely

    # STRIDE is Information-Disclosure -> Confidentiality. Baseline is "very-high" (the
    # ceiling), so only the downward (Confidentiality low) delta is reachable -- a collapsed
    # boundary exposes everything the encryptor was relied upon to protect, regardless of this
    # asset's own rating.
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - confidentiality_low: true
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: restricted
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - assign:
                  confidentiality_low: false
        - if:
            and:
              - true: "{confidentiality_low}"
              - false: "{mission_critical}"
            then:
              - return: high
            else:
              - return: very-high
