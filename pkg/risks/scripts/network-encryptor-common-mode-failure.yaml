id: network-encryptor-common-mode-failure
title: "CSfC Network Encryptor Common-Mode Failure"
function: architecture
stride: information-disclosure
finding_class: control-not-evidenced
cwe: 653
description: >
  A CSfC-approved network encryption architecture requires two independent encryption layers, built
  from diverse components, so that a flaw in one layer alone cannot expose plaintext (red) traffic
  to the untrusted (black) side. However, a collapsed single layer, or two layers that share a
  vendor, codebase, or vulnerability, defeats that independence requirement without any outward sign
  of failure.
impact: >
  If this risk remains unmitigated, a single flaw common to both encryption layers, or a deployment
  that silently runs only one layer, lets classified or CUI plaintext cross the red/black boundary
  with the same apparent assurance as a properly layered deployment.
asvs: "V9 - Communications"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html"
action: 'Confirm that the two required encryption layers are built from diverse, independently sourced components, with no shared vendor, codebase, or known common vulnerability.'
mitigation: >
  Verify that both encryption layers required by the CSfC Capability Package are actually present
  and independently keyed. In other words, they must not be a single layer misconfigured to appear
  as two, nor two layers from the same vendor, or sharing underlying code, that a single
  vulnerability could defeat at once. Additionally, re-verify this independence periodically, since
  a hardware replacement, a firmware update, or a configuration change after the initial
  accreditation could silently collapse the two layers into one without any functional symptom.
  Finally, maintain documented key management and rotation for each layer separately. References
  include the NSA Commercial Solutions for Classified (CSfC) Customer Handbook and NIST SP 800-53
  SC-8 (Transmission Confidentiality and Integrity) and SC-13 (Cryptographic Protection).
check: 'Are the two required CSfC encryption layers independently sourced and keyed, with no shared vendor, codebase, or known common vulnerability, and is that independence re-verified periodically?'
detection_logic: >
  Audit the encryption architecture's documentation and configuration for evidence that both
  required layers are present, independently keyed, and sourced from diverse components.
  Additionally, confirm that a recurring re-verification process exists, distinct from the one-time
  initial accreditation.
risk_assessment: >
  Critical for any CSfC-architected transport whose two-layer independence has not been verified
  since the initial accreditation, or where both layers share a vendor or codebase.
false_positives: >
  This rule fires on every in-scope network encryptor asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once the two-layer independence is confirmed and a recurring re-verification process is in place.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.network-encryptor}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>CSfC Network Encryptor Common-Mode Failure</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset.raa})"

    # Impact: high baseline plus the CIA step on C (STRIDE information-disclosure).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.confidentiality})"
