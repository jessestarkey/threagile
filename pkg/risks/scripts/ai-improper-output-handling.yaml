id: ai-improper-output-handling
title: "Improper Output Handling"
function: architecture
stride: tampering
finding_class: weakness-shown
cwe: 74
description: >
  Model output leaves this AI asset for something that interprets it, such as a browser, a database
  query, a shell, a template engine, or another API. Output steered by prompt injection, or simply
  wrong, is consumed without the encoding or validation that untrusted input would get.
impact: >
  If this risk remains unmitigated, upstream prompt manipulation turns directly into XSS, SQL or
  command injection, SSRF, or unauthorized API calls on the consumer, and insecure generated code
  ships into the systems that run it.
asvs: "V1 - Encoding and Sanitization"
cheat_sheet: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
action: 'Treat model output as untrusted input at every place it is consumed, with the encoding, validation, or sandboxing that the specific sink needs.'
mitigation: >-
  Treat model output as untrusted user input at each sink. Specifically, (1) escape anything
  rendered in a browser or template, and block raw HTML, scripts, and auto-loading images or links,
  (2) use parameterized queries instead of SQL built from model text, (3) run model-produced code or
  commands in a sandbox with no ambient credentials, and (4) validate output against an allow-listed
  schema before forwarding it to another API.

  Review and scan generated code before it is merged or run.

  Never trust output because it came from the application's own model, since it reflects whatever
  input the model received, including an indirect injection.
references: >-
  OWASP LLM Top 10 2026 LLM10 (Improper Output Handling, widened to cover generated code); OWASP
  GenAI Data Security 2026 DSGAI05 (Data Integrity and Validation Failures); MITRE ATLAS
  AML.T0037, AML.T0040, and AML.T0077 (LLM Response Rendering); MAESTRO layers 1, 3, and 4;
  CWE-74; CWE-79; CWE-89; CWE-78; CWE-94; NIST SP 800-53 SI-10 and SI-15; Mappings from the OWASP
  GenAI Security Crosswalk 2026-Q3 (https://github.com/GenAI-Security-Project/crosswalk)
check: 'Is context-appropriate encoding, validation, or sandboxing applied at every place this asset''s model output is consumed, and is generated code reviewed and scanned before it runs?'
detection_logic: >
  Trace every consumer of this asset's output, namely the callers that render it and every outgoing
  link, and confirm sink-specific encoding, parameterization, sandboxing, or schema validation.
  Then, in a test environment, send injection payloads through the model, and watch each sink.
risk_assessment: >
  Critical when the output reaches an unsandboxed interpreter or a broadly privileged API.
  Otherwise, the finding is High for any sink without sink-specific encoding or validation.
false_positives: >
  This rule fires on an in-scope ai-llm-endpoint, ai-model-serving, ai-agent-orchestrator, or
  ai-rag-pipeline whose output something consumes. A consumer is any asset that calls it, since the
  caller receives the response, and for a model that is where the output goes. However, monitoring
  and AI observability assets do not count, and neither do agent orchestrators or RAG pipelines,
  since they pass the output on and carry this finding themselves where it finally lands. A consumer
  is also any outgoing link to an asset that is not model or operational infrastructure (an LLM
  endpoint, model serving, an AI gateway, a guardrail, observability, or monitoring). Thus, an agent
  calling its own model is the model's consumer, not a sink of the agent's output. Impact comes from
  the integrity of those consumers. Dispose of a confirmed-compliant asset through risk_tracking,
  logging it as mitigated once every consumer is confirmed to encode, validate, or sandbox the
  output.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - reaches_sink: "output_reaches_sink({tech_asset})"
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.ai-llm-endpoint}"
                  - true: "{.attributes.ai-model-serving}"
                  - true: "{.attributes.ai-agent-orchestrator}"
                  - true: "{.attributes.ai-rag-pipeline}"
            - true: "{reaches_sink}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Improper Output Handling</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True for model or operational infrastructure: an LLM endpoint, model serving, AI gateway,
    # guardrail, AI observability stack, or monitoring.
    is_infra_target:
      parameters:
        - target_id
      do:
        - if:
            any:
              in: "{$model.technical_assets.{target_id}.technologies}"
              or:
                - true: "{.attributes.ai-llm-endpoint}"
                - true: "{.attributes.ai-model-serving}"
                - true: "{.attributes.ai-gateway}"
                - true: "{.attributes.ai-guardrails}"
                - true: "{.attributes.ai-observability-stack}"
                - true: "{.attributes.monitoring}"
            then:
              - return: true
        - return: false

    # True for a monitoring or AI observability caller, which reads metrics rather than
    # consuming the output.
    is_monitoring:
      parameters:
        - asset_id
      do:
        - if:
            any:
              in: "{$model.technical_assets.{asset_id}.technologies}"
              or:
                - true: "{.attributes.monitoring}"
                - true: "{.attributes.ai-observability-stack}"
            then:
              - return: true
        - return: false

    # True for a caller that does not consume the output itself: monitoring, which reads metrics,
    # and an agent or RAG pipeline, which passes the output on and carries this finding itself
    # wherever the output finally lands. Counting it here would raise the finding twice for one
    # chain (model -> agent -> sink).
    is_not_a_consumer:
      parameters:
        - asset_id
      do:
        - assign:
            - monitoring: "is_monitoring({asset_id})"
        - if:
            true: "{monitoring}"
            then:
              - return: true
        - if:
            any:
              in: "{$model.technical_assets.{asset_id}.technologies}"
              or:
                - true: "{.attributes.ai-agent-orchestrator}"
                - true: "{.attributes.ai-rag-pipeline}"
            then:
              - return: true
        - return: false
    # True when the output is consumed: a caller that consumes it (it receives the response), or
    # an outgoing link to an asset that is not model or operational infrastructure.
    output_reaches_sink:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              - assign:
                  - monitoring: "is_not_a_consumer({link.source_id})"
              - if:
                  false: "{monitoring}"
                  then:
                    - return: true
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - assign:
                  - infra: "is_infra_target({link.target_id})"
              - if:
                  false: "{infra}"
                  then:
                    - return: true
        - return: false

    # Likelihood: likely baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset})"

    # Impact baseline: medium.
    # Impact: baseline plus the integrity step for the highest rank across the asset, its
    # non-monitoring callers and the non-infrastructure consumers of its output.
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - best: "cia_rank({tech_asset.integrity})"
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              - assign:
                  - monitoring: "is_not_a_consumer({link.source_id})"
              - if:
                  false: "{monitoring}"
                  then:
                    - assign:
                        - caller_integrity: "{$model.technical_assets.{link.source_id}.integrity}"
                    - assign:
                        - target_rank: "cia_rank({caller_integrity})"
                    - if:
                        greater:
                          first: "{target_rank}"
                          second: "{best}"
                        then:
                          - assign:
                              best: "{target_rank}"
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - assign:
                  - infra: "is_infra_target({link.target_id})"
              - if:
                  false: "{infra}"
                  then:
                    - assign:
                        - target_integrity: "{$model.technical_assets.{link.target_id}.integrity}"
                    - assign:
                        - target_rank: "cia_rank({target_integrity})"
                    - if:
                        greater:
                          first: "{target_rank}"
                          second: "{best}"
                        then:
                          - assign:
                              best: "{target_rank}"
        - return: "adjust_impact_rank(medium, {best})"
