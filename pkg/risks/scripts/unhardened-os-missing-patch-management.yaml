id: unhardened-os-missing-patch-management
title: "Unhardened OS / Missing Patch Management"
function: operations
stride: elevation-of-privilege
finding_class: control-not-evidenced
cwe: 1104
description: >
  The virtual machine is not deployed from a STIG-compliant baseline image, and it has no automated
  patch management in place.
impact: >
  If this risk remains unmitigated, the operating system accumulates known, unpatched CVEs and
  configuration drift, which make privilege escalation substantially easier.
asvs: "V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
action: 'Enforce STIG baselines and automated patching.'
mitigation: >-
  Provision VMs exclusively from DoD-approved, STIG-compliant marketplace images, and enroll them in
  strict automated update schedules that meet the SLA patching requirements.
references: >-
  CWE-1104 (Use of Unmaintained Third Party Components); NIST SP 800-53 SI-2 (Flaw Remediation)
  and CM-6 (Configuration Settings); MITRE ATT&CK T1068 (Exploitation for Privilege Escalation);
  DISA OS STIGs
check: 'Is this VM provisioned from a STIG-compliant baseline image and enrolled in automated patching?'
detection_logic: >
  Audit the platform's patch-management compliance logs, and run automated STIG compliance scans
  (for example, ACAS or Nessus) against the host.
risk_assessment: >
  High, since the gap carries a high risk of compromise through known vulnerabilities.
false_positives: >
  This rule fires on every in-scope virtual machine asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once the VM is confirmed to be provisioned from a STIG-compliant baseline image and enrolled in
  automated patching.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.machine}"
                second: virtual
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Unhardened OS / Missing Patch Management</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset})"

    # Impact: medium baseline plus the CIA step on max(C,I,A) (STRIDE elevation-of-privilege).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.confidentiality}, {tech_asset.integrity}, {tech_asset.availability})"
