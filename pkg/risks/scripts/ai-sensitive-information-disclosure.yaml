id: ai-sensitive-information-disclosure
title: "Sensitive Information Disclosure via Model Output"
function: architecture
stride: information-disclosure
finding_class: weakness-shown
cwe: 200
description: >
  An LLM endpoint, RAG pipeline, or agent has confidential-or-higher data within reach (in prompts,
  documents, tools, or training) and answers requests from outside its trust boundary. A model does
  not reliably keep what it sees to itself, so crafted questions or over-sharing can disclose that
  data.
impact: >
  If this risk remains unmitigated, confidential data that the model can reach leaves the trust
  boundary inside ordinary-looking responses. As a result, it bypasses the access controls that
  protect the same data everywhere else.
asvs: "V8 - Authorization"
cheat_sheet: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
action: 'Keep sensitive data out of what the model can reach unless the requester is authorized for it, and filter outputs for sensitive content before they leave the boundary.'
mitigation: >-
  Give the model only data that the requesting user is entitled to see, enforcing authorization when
  documents are retrieved and tools are called, rather than instructing the model to withhold
  content.

  Minimize, mask, or tokenize sensitive fields before they enter prompts or retrieval indexes.

  Keep confidential data out of training and fine-tuning sets, unless the model is confined to users
  who are cleared for it.

  Scan outputs for sensitive patterns and classification markings before they cross the boundary,
  and block or redact any matches.

  Log responses for review.
references: >-
  OWASP LLM Top 10 2026 LLM02 (Sensitive Information Disclosure); OWASP GenAI Data Security 2026
  DSGAI01 (Sensitive Data Leakage) and DSGAI09 (Multimodal Cross-Channel Leakage); MITRE ATLAS
  AML.T0057 and AML.T0024; MAESTRO layers 1, 2, and 5; CWE-200; CWE-201; CWE-359; NIST SP 800-53
  AC-3, AC-4, SC-28, and SI-4; Mappings from the OWASP GenAI Security Crosswalk 2026-Q3
  (https://github.com/GenAI-Security-Project/crosswalk)
check: 'Is the model limited to the data each requester is authorized for, with authorization at retrieval and tool time, sensitive fields minimized before they enter the context, and outputs scanned before they leave the boundary?'
detection_logic: >
  Inventory the confidential data that the model can reach through prompts, retrieval, tools, and
  training. Then, from outside the trust boundary, attempt to elicit that data with direct questions
  and prompt-injection payloads. Finally, review the output-filtering coverage and the response
  logs.
risk_assessment: >
  Critical when a model that answers requesters outside its trust boundary can reach strictly
  confidential data, with no output filtering. However, the finding is High for confidential data.
false_positives: >
  This rule fires on an in-scope ai-llm-endpoint, ai-rag-pipeline, or ai-agent-orchestrator that
  processes a data asset rated confidential or higher, and that is internet-facing or has an
  incoming link from an outside caller. An outside caller is an external entity, an internet-facing
  or out-of-scope asset, or a frontend (a web application, reverse proxy, WAF, load balancer, or
  client) in a different network boundary. As in Threagile's own rules, execution-environment
  boundaries are looked through to the enclosing network boundary. Dispose of a confirmed-compliant
  asset through risk_tracking, logging it as mitigated once retrieval-time authorization, input
  minimization, and output filtering are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - holds_sensitive: "processes_confidential({tech_asset})"
          - exposed: "receives_from_outside({tech_asset})"
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.ai-llm-endpoint}"
                  - true: "{.attributes.ai-rag-pipeline}"
                  - true: "{.attributes.ai-agent-orchestrator}"
            - true: "{holds_sensitive}"
            - true: "{exposed}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Sensitive Information Disclosure via Model Output</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True when the asset is internet-facing, or an incoming link comes from an outside caller
    # (see is_outside_caller).
    receives_from_outside:
      parameters:
        - tech_asset
      do:
        - if:
            true: "{tech_asset.internet}"
            then:
              - return: true
        - assign:
            - own_boundary: "network_boundary({tech_asset.id})"
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              - assign:
                  - outside: "is_outside_caller({link.source_id}, {own_boundary})"
              - if:
                  true: "{outside}"
                  then:
                    - return: true
        - return: false

    # --- Exposure helpers (shared text; the DSL has no cross-file helpers) ---
    # Network boundary of an asset, following the network-only semantics of Threagile's own
    # built-in rules: its directly containing trust boundary, or, when that is an
    # execution-environment boundary, the nearest enclosing boundary that is not (up to three
    # levels). Empty when the asset is in no boundary. network-on-prem is the zero value of the
    # boundary type and is dropped on re-serialization, so "not execution-environment" is tested.
    network_boundary:
      parameters:
        - asset_id
      do:
        - assign:
            - boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{asset_id}.id}"
        - if:
            not-equal:
              first: "{$model.trust_boundaries.{boundary}.type}"
              second: execution-environment
            then:
              - return: "{boundary}"
        - assign:
            - boundary: "parent_boundary({boundary})"
        - if:
            not-equal:
              first: "{$model.trust_boundaries.{boundary}.type}"
              second: execution-environment
            then:
              - return: "{boundary}"
        - assign:
            - boundary: "parent_boundary({boundary})"
        - if:
            not-equal:
              first: "{$model.trust_boundaries.{boundary}.type}"
              second: execution-environment
            then:
              - return: "{boundary}"
        - assign:
            - boundary: "parent_boundary({boundary})"
        - return: "{boundary}"

    # Id of the trust boundary that nests the given one, or empty.
    parent_boundary:
      parameters:
        - child
      do:
        - loop:
            in: "{$model.trust_boundaries}"
            item: candidate
            do:
              - if:
                  contains:
                    item: "{child}"
                    in: "{candidate.trust_boundaries_nested}"
                  then:
                    - return: "{candidate.id}"
        - return: ""

    # True for an asset outside the organization's own systems: internet-facing, out of scope,
    # or an external entity (the zero value of type, dropped on re-serialization, so "neither
    # process nor datastore" is tested).
    is_external:
      parameters:
        - asset_id
      do:
        - if:
            or:
              - true: "{$model.technical_assets.{asset_id}.internet}"
              - true: "{$model.technical_assets.{asset_id}.out_of_scope}"
              - and:
                  - not-equal:
                      first: "{$model.technical_assets.{asset_id}.type}"
                      second: process
                  - not-equal:
                      first: "{$model.technical_assets.{asset_id}.type}"
                      second: datastore
            then:
              - return: true
        - return: false

    is_frontend_asset:
      parameters:
        - asset_id
      do:
        - if:
            any:
              in: "{$model.technical_assets.{asset_id}.technologies}"
              true: "{.attributes.frontend_related}"
            then:
              - return: true
        - return: false

    # True when a caller brings outside requests or content in: it is external, or it is a
    # frontend (web application, reverse proxy, WAF, client, ...) in a different network
    # boundary from the given one.
    is_outside_caller:
      parameters:
        - caller_id
        - own_boundary
      do:
        - assign:
            - external: "is_external({caller_id})"
        - if:
            true: "{external}"
            then:
              - return: true
        - assign:
            - frontend: "is_frontend_asset({caller_id})"
            - caller_boundary: "network_boundary({caller_id})"
        - if:
            and:
              - true: "{frontend}"
              - not-equal:
                  first: "{caller_boundary}"
                  second: "{own_boundary}"
            then:
              - return: true
        - return: false

    processes_confidential:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{tech_asset.data_assets_processed}"
            item: data_id
            do:
              - if:
                  or:
                    - equal:
                        first: "{$model.data_assets.{data_id}.confidentiality}"
                        second: confidential
                    - equal:
                        first: "{$model.data_assets.{data_id}.confidentiality}"
                        second: strictly-confidential
                  then:
                    - return: true
        - return: false

    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact baseline: medium.
    # Impact: baseline plus the confidentiality step. The rule fires only when confidential
    # or higher data is involved, so that data sets the floor for the step.
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.confidentiality}, confidential)"
