id: dependency-confusion-internal-namespace
title: Dependency Confusion via Unclaimed Internal Package Namespace
function: architecture
stride: tampering
finding_class: control-not-evidenced
cwe: 427
description: >
  This build pipeline's dependency resolver may fall back to a public package index when a package
  is not found in the internal feed, unless internally named packages are restricted to that feed.
impact: >
  If this risk remains unmitigated, an attacker who publishes a higher-versioned package under the
  internal name on the public index causes the build to pull and execute the attacker's code
  instead.
asvs: "V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
action: 'Configure the dependency resolver to treat the internal package namespace as authoritative, refusing to fall back to a public index for internally named packages.'
mitigation: >-
  Configure the package manager's scoped registry or upstream source settings, so that internally
  named packages resolve only from the internal feed, with no fallback to a public index for that
  namespace.

  Examples include npm scoped packages, a private PyPI index pinned with --index-url rather than
  --extra-index-url, and NuGet package source mapping.

  Where a dependency proxy or artifact repository manager is used, configure it to reserve the
  internal namespace and to block public-index publication under names that match it.
references: >-
  NIST SP 800-53 SR-4 (Provenance); NIST SP 800-218 (Secure Software Development Framework, PW.4);
  OWASP Dependency Confusion guidance
check: 'Does the dependency resolver''s configuration restrict internally named packages to the internal feed, with no public-index fallback?'
detection_logic: >
  Audit the package manager's scoped registry or upstream source configuration for every internally
  named package namespace, and confirm that no fallback to a public index is configured.
risk_assessment: >
  Critical for any build pipeline that resolves internally named packages through a resolver
  configuration that permits a public-index fallback.
false_positives: >
  This rule fires on every in-scope build pipeline asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once the resolver is confirmed to restrict internally named packages to the internal feed, with no
  public-index fallback.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.build-pipeline}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Dependency Confusion via Unclaimed Internal Package Namespace</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: high baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.integrity})"
