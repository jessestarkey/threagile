id: ai-gateway-credential-sprawl
title: "AI Gateway Credential Sprawl and Cross-Backend Prompt Interception"
function: architecture
stride: information-disclosure
cwe: 522
description: >
  A gateway routing requests across multiple LLM backends concentrates the credentials for
  every one of those backends in a single location, and sees every prompt and response crossing
  any of them in the clear.
impact: >
  If this risk remains unmitigated, compromise of the gateway discloses every downstream
  provider's credentials at once and exposes the full content of every AI interaction routed
  through it, regardless of which backend actually handled the request.
asvs: "V6 - Stored Cryptography"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
action: "Vault every backend credential the gateway holds individually, scope each to the minimum capability needed, and log/redact prompt and response content passing through the gateway."
mitigation: >
  Store each backend provider's API key or credential in a secrets vault scoped to that
  provider alone, never co-located in a single flat configuration file or environment variable
  set the gateway process can read in bulk. Rotate backend credentials independently of one
  another. Apply PII/CUI redaction or tokenization to prompts and responses at the gateway
  before they are logged for cost-tracking or observability purposes. Monitor for anomalous
  routing patterns that could indicate a compromised gateway silently re-routing traffic to an
  attacker-controlled backend. References: NIST SP 800-53 IA-5 (Authenticator Management); NIST
  SP 800-53 SC-8 (Transmission Confidentiality and Integrity); OWASP API Security Top 10 API8
  (Security Misconfiguration).
check: "Is each backend's credential vaulted and scoped individually rather than held in one flat configuration, and is prompt/response content redacted before being logged for cost-tracking or observability?"
detection_logic: >
  Audit the gateway's credential storage for per-backend scoping and rotation independence.
  Review logging/observability configuration for redaction of prompt and response content.
  Monitor routing configuration changes for unauthorized backend additions.
risk_assessment: >
  High for any gateway routing to more than one external AI provider with credentials stored in
  a single shared configuration. Critical if the gateway also logs unredacted prompt/response
  content containing CUI.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope AI-gateway asset,
  by design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it as
  mitigated once each backend credential is confirmed individually vaulted and scoped, with
  prompt/response content redacted before logging.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.ai-gateway}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>AI Gateway Credential Sprawl and Cross-Backend Prompt Interception</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "likely" (a mid tier, not an edge), so all 3 outcomes (possible/likely/
    # very-likely) are reachable via the RAA delta.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: possible
            else:
              - if:
                  equal-or-greater:
                    first: "{tech_asset.raa}"
                    second: 40
                  then:
                    - return: very-likely
                  else:
                    - return: likely

    # STRIDE is Information-Disclosure -> Confidentiality. Baseline is "very-high" (the
    # ceiling), so only the downward (Confidentiality low) delta is reachable -- a gateway's
    # blast radius spans every backend it routes to, regardless of this asset's own rating.
    # Impact is purely a function of this asset's own Confidentiality rank -- the model-wide
    # Business Criticality bump that used to apply here was removed (see git history / the
    # sibling Python engine's compute_impact() for the rationale: it mostly inflated
    # already-peripheral assets rather than protecting genuinely under-rated ones).
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - confidentiality_low: true
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: restricted
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - assign:
                  confidentiality_low: false
        - if:
            true: "{confidentiality_low}"
            then:
              - return: high
            else:
              - return: very-high
