id: mishandling-exceptional-conditions
title: Mishandling of Exceptional Conditions
function: architecture
stride: elevation-of-privilege
finding_class: control-not-evidenced
cwe: 755
description: >
  The application does not consistently handle exceptional conditions (unhandled exceptions,
  malformed input, and resource exhaustion) as a fail-closed case. Thus, an exception on an
  authorization- or validation-critical path can fall through to an allowed state instead of a
  denied one. Alternatively, an unhandled error response can leak internal implementation detail.
impact: >
  If this risk remains unmitigated, an attacker can trigger an edge-case or malformed-input
  exception to bypass an authorization or validation control that only runs on the successful path.
  Furthermore, the attacker can harvest stack traces, internal paths, or library versions from an
  unhandled error response to aid further attacks.
asvs: "V7 - Error Handling and Logging"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html"
action: 'Ensure that every authorization- or validation-critical code path fails closed on an unhandled exception, and that client-facing error responses never include internal implementation detail.'
mitigation: >-
  Wrap every authorization- and validation-critical code path in explicit exception handling that
  defaults to a deny, or fail-closed, outcome.

  Return generic, non-identifying error messages to the client, and log the full exception detail
  only on the server, correlated to a request ID.

  Add explicit test coverage for the exception paths themselves, not only the happy path.

  Apply resource limits, so that a resource-exhaustion condition degrades gracefully.
references: >-
  OWASP Top 10:2025 A10 (Mishandling of Exceptional Conditions); NIST SP 800-53 SI-11 (Error
  Handling); CWE-755
check: 'Does every authorization- and validation-critical exception path fail closed, with client-facing responses confirmed to be free of internal implementation detail?'
detection_logic: >
  Run fuzz and negative testing (malformed input, boundary values, and forced resource exhaustion)
  against every authorization- and validation-critical endpoint, and confirm that each exception
  path denies access rather than falling through to an allowed state. Additionally, scan the
  application logs and error-tracking tooling for stack traces or internal paths in client-facing
  responses.
risk_assessment: >
  High for any asset whose exception paths have not been explicitly tested for fail-closed behavior
  on authorization- or validation-critical logic. However, the finding rises to Critical if a known
  unhandled-exception path has been confirmed to bypass an authentication or authorization check.
false_positives: >
  This rule fires on every in-scope app-tier asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once (1)
  every authorization- and validation-critical code path has explicit, fail-closed exception
  handling with test coverage, and (2) client-facing error responses are confirmed to omit stack
  traces and internal implementation detail. This category partially overlaps CUI Telemetry Spillage
  on error and stack-trace content. However, the two cover distinct channels, so they are not
  duplicates. Specifically, this category concerns what an unhandled exception exposes in the
  client-facing HTTP response, and whether it fails open on an authorization check, whereas CUI
  Telemetry Spillage concerns what ends up written to logs and telemetry, regardless of
  client-facing behavior.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  # Narrower than frontend_related/backend_related (used by the sibling CUI Telemetry
  # Spillage/AU-2/Baseline Security Event Logging checks): this category's whole premise is an
  # authorization/validation check in this asset's OWN code falling through to an allowed state
  # on an unhandled exception, which requires the asset to actually own request/job-processing
  # logic. A managed datastore (database, vault) or pure network/traffic plumbing (reverse-proxy,
  # load-balancer, WAF) has no such code of its own, so application_logic -- granted only to
  # technologies that genuinely process requests or jobs -- excludes them deliberately.
  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.application_logic}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Mishandling of Exceptional Conditions</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset.raa})"

    # Impact: low baseline plus the CIA step on max(C,I,A) (STRIDE elevation-of-privilege).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.confidentiality}, {tech_asset.integrity}, {tech_asset.availability})"
