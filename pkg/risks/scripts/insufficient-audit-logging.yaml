id: insufficient-audit-logging
title: "Insufficient Security Event Logging (AU-2 / AU-6 Gap)"
function: operations
stride: repudiation
finding_class: control-not-evidenced
cwe: 778
description: >
  The asset does not generate audit records for the event types NIST SP 800-53 AU-2 requires --
  authentication attempts and failures, authorization denials, input-validation rejections,
  privilege escalation, and administrative actions -- or does not forward them to the SIEM where
  they can be correlated.
impact: >
  If this risk remains unmitigated, the SOC cannot detect sustained probing, credential stuffing,
  or authorization-bypass attempts as they build up, or reconstruct an attack after the fact, and
  the gap independently blocks ATO under DoD RMF.
asvs: "V7 - Error Handling and Logging"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html"
action: "Log every AU-2 event type, including each authentication failure, authorization denial and input-validation rejection, with the calling identity, and forward them to a centralized, tamper-evident SIEM with correlation rules."
mitigation: >
  Implement structured logging (JSON) capturing at minimum timestamp, event type, user identity
  (or service account, API key, or source IP where unauthenticated), target resource, and outcome
  for all AU-2 event categories, including every authentication failure, authorization denial,
  and input-validation rejection. Forward the events to a centralized SIEM with retention meeting
  the applicable data retention policy, and build correlation rules that flag a single identity or
  source crossing a threshold of failures within a rolling window. Ensure application-layer
  authentication events are logged in addition to infrastructure-layer events, and protect log
  integrity. References: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 AU-6 (Audit Record
  Review, Analysis, and Reporting); NIST SP 800-53 AU-12 (Audit Record Generation); NIST SP 800-53
  SI-4 (System Monitoring); DoD RMF Process Guide; DISA Application Security STIG.
check: "Have AU-2 required event types, including authentication failures, authorization denials and input-validation rejections, been confirmed logged and forwarded to the SIEM with active correlation rules, with evidence?"
detection_logic: >
  Run automated AU-2 coverage checks by querying the SIEM for required event type presence over a
  rolling 30-day window, and alert on gaps where expected event types show zero occurrences -- the
  absence of expected security-event volume is itself the signal of a broken forwarding pipeline.
  Alert when a single identity or source crosses a defined threshold of authentication failures,
  authorization denials, or input-validation rejections within a rolling window.
risk_assessment: >
  Medium (CAT II). Escalates to High if no application-layer security event logging exists at
  all, or if security events are logged but never forwarded to the SIEM -- infrastructure logs
  alone do not satisfy AU-2 for application-level access control events.
false_positives: >
  Fires on every in-scope app-tier asset (frontend, backend, or application logic) by design: the
  model can't show whether logging is in place. This rule absorbed
  baseline-security-event-logging-gap (2026-11-18), which fired on exactly the same assets for the
  forwarding half of the same control. Dispose of a confirmed-compliant asset through
  risk_tracking: log it as mitigated once AU-2 event coverage and SIEM forwarding with correlation
  rules are confirmed with log samples as evidence.
risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  # application_logic is OR'd in alongside frontend_related/backend_related to also catch
  # technologies (application-server, report-engine, web-server, llm-endpoint) that carry
  # neither of those two but genuinely have their own audit-relevant request/job-processing
  # surface.
  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.frontend_related}"
                  - true: "{.attributes.backend_related}"
                  - true: "{.attributes.application_logic}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Insufficient Audit Logging (AU-2 Compliance Gap)</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset.raa})"

    # Impact: low baseline plus the CIA step on I (STRIDE repudiation).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.integrity})"
