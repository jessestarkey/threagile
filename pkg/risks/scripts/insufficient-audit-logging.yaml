id: insufficient-audit-logging
title: "Insufficient Security Event Logging (AU-2 / AU-6 Gap)"
function: operations
stride: repudiation
finding_class: control-not-evidenced
cwe: 778
description: >
  The asset does not generate audit records for the NIST SP 800-53 AU-2 event types (authentication
  failures, authorization denials, validation rejections, privilege escalation, and administrative
  actions), or does not forward them to the SIEM.
impact: >
  If this risk remains unmitigated, the SOC cannot detect probing, credential stuffing, or
  authorization-bypass attempts as they build, or reconstruct an attack afterward. The gap also
  blocks the ATO under the DoD RMF.
asvs: "V7 - Error Handling and Logging"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html"
action: 'Log every AU-2 event type, including each authentication failure, authorization denial, and input-validation rejection, with the calling identity. Then, forward the events to a centralized, tamper-evident SIEM with correlation rules.'
mitigation: >-
  Implement structured (JSON) logging that captures, at a minimum, the timestamp, event type, user
  identity (or the service account, API key, or source IP where the request is unauthenticated),
  target resource, and outcome for every AU-2 event category, including every authentication
  failure, authorization denial, and input-validation rejection.

  Forward the events to a centralized SIEM with retention that meets the applicable data retention
  policy, and build correlation rules that flag a single identity or source crossing a threshold of
  failures within a rolling window.

  Ensure that application-layer authentication events are logged in addition to infrastructure-layer
  events.

  Protect the integrity of the logs.
references: >-
  NIST SP 800-53 AU-2 (Event Logging), AU-6 (Audit Record Review, Analysis, and Reporting), AU-12
  (Audit Record Generation), and SI-4 (System Monitoring); DoD RMF Process Guide; DISA Application
  Security STIG
check: 'Have the AU-2 required event types, including authentication failures, authorization denials, and input-validation rejections, been confirmed, with evidence, as logged and forwarded to the SIEM with active correlation rules?'
detection_logic: >
  Run automated AU-2 coverage checks by querying the SIEM for the presence of each required event
  type over a rolling 30-day window, and alert on gaps where an expected event type shows zero
  occurrences, since the absence of expected security-event volume is itself the signal of a broken
  forwarding pipeline. Additionally, alert when a single identity or source crosses a defined
  threshold of authentication failures, authorization denials, or input-validation rejections within
  a rolling window.
risk_assessment: >
  Medium, which corresponds to a CAT II finding. However, the finding rises to High if no
  application-layer security event logging exists at all, or if security events are logged but never
  forwarded to the SIEM, since infrastructure logs alone do not satisfy AU-2 for application-level
  access control events.
false_positives: >
  This rule fires on every in-scope app-tier asset (a frontend, backend, or application logic) by
  design, since the model cannot show whether logging is in place. It also covers the forwarding
  half of the same control. Dispose of a confirmed-compliant asset through risk_tracking, logging it
  as mitigated once AU-2 event coverage, and SIEM forwarding with correlation rules, are confirmed
  with log samples as evidence.
risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  # application_logic is OR'd in alongside frontend_related/backend_related to also catch
  # technologies (application-server, report-engine, web-server, llm-endpoint) that carry
  # neither of those two but genuinely have their own audit-relevant request/job-processing
  # surface.
  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.frontend_related}"
                  - true: "{.attributes.backend_related}"
                  - true: "{.attributes.application_logic}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Insufficient Security Event Logging (AU-2 / AU-6 Gap)</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset})"

    # Impact: low baseline plus the CIA step on I (STRIDE repudiation).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.integrity})"
