id: insufficient-audit-logging
title: "Insufficient Audit Logging (AU-2 Compliance Gap)"
function: operations
stride: information-disclosure
cwe: 778
description: >
  The asset does not generate audit records for the event types NIST SP 800-53 AU-2 requires,
  such as authentication attempts, privilege escalation, and administrative actions.
impact: >
  If this risk remains unmitigated, the SOC cannot detect or reconstruct an attack after the
  fact, and the gap independently blocks ATO under DoD RMF.
asvs: "V7 - Error Handling and Logging"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html"
action: "Implement structured audit logging for all AU-2 required event types and forward to a centralized, tamper-evident SIEM."
mitigation: >
  Implement structured logging (JSON) capturing at minimum timestamp, event type, user identity,
  source IP, target resource, and outcome for all AU-2 event categories. Forward logs to a
  centralized SIEM with retention meeting the applicable data retention policy. Ensure
  application-layer authentication events are logged in addition to infrastructure-layer events.
  Implement log integrity protection. References: NIST SP 800-53 AU-2 (Event Logging); NIST SP
  800-53 AU-12 (Audit Record Generation); DoD RMF Process Guide; DISA Application Security STIG.
check: "Have AU-2 required event types been formally reviewed and confirmed logged with evidence?"
detection_logic: >
  Run automated AU-2 coverage checks by querying the SIEM for required event type presence over a
  rolling 30-day window. Alert on gaps where expected event types show zero occurrences.
risk_assessment: >
  Medium (CAT II). Escalates to High if no application-layer security event logging exists at
  all -- infrastructure logs alone do not satisfy AU-2 for application-level access control
  events.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope app-tier asset, by
  design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it as
  mitigated once AU-2 event coverage has been formally reviewed and documented with log samples as
  evidence.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.frontend_related}"
                  - true: "{.attributes.backend_related}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Insufficient Audit Logging (AU-2 Compliance Gap)</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            equal-or-greater:
              first: "{tech_asset.raa}"
              second: 40
            then:
              - return: very-likely
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: possible
        - return: likely

    # STRIDE is Information-Disclosure -> Confidentiality. Baseline is "medium".
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - cia_rank: low
        - if:
            equal:
              first: "{tech_asset.confidentiality}"
              second: restricted
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - if:
                  true: "{mission_critical}"
                  then:
                    - return: high
                  else:
                    - return: medium
        - if:
            true: "{mission_critical}"
            then:
              - return: medium
            else:
              - return: low
