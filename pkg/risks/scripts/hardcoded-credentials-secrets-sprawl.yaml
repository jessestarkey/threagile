id: hardcoded-credentials-secrets-sprawl
title: Hardcoded Credentials and Secrets Sprawl
function: architecture
stride: information-disclosure
cwe: 798
description: >
  This asset authenticates to another asset with a static secret -- a username/password, API key,
  or client-certificate private key -- that has to live somewhere the asset can read it. Such
  secrets end up embedded in source code, container images, or configuration files, and copies
  of them persist across git history, image layers, and build caches even after rotation.
impact: >
  If this risk remains unmitigated, a discovered secret provides immediate authenticated access
  to the resource it protects, and is often found by automated scanning within hours of exposure.
asvs: "V2 - Authentication / V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
action: "Rotate any exposed secrets immediately, then eliminate all hardcoded credentials by migrating to a vault-backed secrets management solution."
mitigation: >
  Enforce pre-commit and CI/CD pipeline secret scanning to block credential commits at the
  source. Migrate all secrets to a hardware-backed vault and inject at runtime via managed
  identity -- never via environment variables in manifests or baked into images. Where the
  target supports it, replace the static secret entirely with an issued, short-lived token
  (managed identity, workload identity federation). Enforce RBAC on vault access policies scoped
  to individual workload identities. Implement secret rotation schedules. Audit git history and
  container image layers for historical secret exposure. References: CWE-798 (Use of Hard-Coded
  Credentials); MITRE ATT&CK T1552.001 (Unsecured Credentials -- Credentials In Files);
  CAPEC-191 (Read Sensitive Constants Within an Executable); NIST SP 800-53 IA-5 (Authenticator
  Management); NIST SP 800-53 CM-6 (Configuration Settings); DoD DevSecOps Reference
  Architecture.
check: "Is secret scanning integrated into the CI/CD pipeline, and are all credentials sourced from a vault rather than embedded in code, images, or config?"
detection_logic: >
  Run secret-scanning tooling against the full git history of all repositories in scope, not
  just HEAD. Scan all container image layers for embedded secrets. Monitor vault access logs for
  anomalous access patterns indicating credential theft.
risk_assessment: >
  High if secret scanning is not integrated into the CI/CD pipeline. Critical if live credentials
  are found in a public or broadly-accessible repository.
false_positives: >
  All credential references in source code are confirmed to be references to vault paths or
  environment variable names only -- no literal secret values are present -- validated by
  automated secret scanning with zero findings; dispose of the finding through risk_tracking.
  Fires on any in-scope asset with an outgoing communication link whose authentication is
  `credentials` or `client-certificate` (the two Threagile authentication values that require
  the asset itself to hold a static secret), except a vault-technology asset. `token` does not
  fire: Threagile defines it as a server-generated token, i.e. issued at runtime rather than
  stored. Model a static API key or shared secret as `credentials`, not `token`, or this rule
  cannot see it. Likelihood steps down one level when the asset also has an outgoing link to a
  vault, the model's signal that secrets are fetched at runtime rather than embedded.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - is_vault: false
          - holds_static_secret: "has_static_secret_link({tech_asset})"
      - if:
          any:
            in: "{tech_asset.technologies}"
            true: "{.attributes.vault}"
          then:
            - assign:
                is_vault: true
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - false: "{is_vault}"
            - true: "{holds_static_secret}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Hardcoded Credentials and Secrets Sprawl</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True when any outgoing link authenticates with a secret the asset itself must hold.
    # Only non-zero enum values are compared, so the omitempty pitfall (zero values vanish on
    # re-serialization) does not apply here.
    has_static_secret_link:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - if:
                  or:
                    - equal:
                        first: "{link.authentication}"
                        second: credentials
                    - equal:
                        first: "{link.authentication}"
                        second: client-certificate
                  then:
                    - return: true
        - return: false

    # True when any outgoing link targets a vault-technology asset: the model's signal that
    # this asset fetches its secrets at runtime rather than embedding them.
    has_vault_link:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - if:
                  any:
                    in: "{$model.technical_assets.{link.target_id}.technologies}"
                    true: "{.attributes.vault}"
                  then:
                    - return: true
        - return: false

    # Baseline is "very-likely" (the ceiling). Two independent one-level steps down: the asset
    # links to a vault (secrets likely fetched at runtime), and RAA < 15 (low-value asset).
    # Both together give "possible".
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - assign:
            - uses_vault: "has_vault_link({tech_asset})"
        - if:
            and:
              - true: "{uses_vault}"
              - less:
                  first: "{tech_asset.raa}"
                  second: 15
            then:
              - return: possible
        - if:
            or:
              - true: "{uses_vault}"
              - less:
                  first: "{tech_asset.raa}"
                  second: 15
            then:
              - return: likely
        - return: very-likely

    # STRIDE is Information-Disclosure -> Confidentiality. Baseline is "high".
    # Impact is purely a function of this asset's own Confidentiality rank -- the model-wide
    # Business Criticality bump that used to apply here was removed (see git history / the
    # sibling Python engine's compute_impact() for the rationale: it mostly inflated
    # already-peripheral assets rather than protecting genuinely under-rated ones).
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - cia_rank: low
        - if:
            equal:
              first: "{tech_asset.confidentiality}"
              second: restricted
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: very-high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - return: high
        - return: medium
