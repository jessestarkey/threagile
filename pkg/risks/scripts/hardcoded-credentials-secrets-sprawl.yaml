id: hardcoded-credentials-secrets-sprawl
title: Hardcoded Credentials and Secrets Sprawl
function: architecture
stride: information-disclosure
cwe: 798
description: >
  Credentials, API keys, or other secrets are embedded in source code, container images, or
  configuration files, and copies of them persist across git history, image layers, and build
  caches even after rotation.
impact: >
  If this risk remains unmitigated, a discovered secret provides immediate authenticated access
  to the resource it protects, and is often found by automated scanning within hours of exposure.
asvs: "V2 - Authentication / V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
action: "Rotate any exposed secrets immediately, then eliminate all hardcoded credentials by migrating to a vault-backed secrets management solution."
mitigation: >
  Enforce pre-commit and CI/CD pipeline secret scanning to block credential commits at the
  source. Migrate all secrets to a hardware-backed vault and inject at runtime via managed
  identity -- never via environment variables in manifests or baked into images. Enforce RBAC on
  vault access policies scoped to individual workload identities. Implement secret rotation
  schedules. Audit git history and container image layers for historical secret exposure.
  References: NIST SP 800-53 IA-5 (Authenticator Management); NIST SP 800-53 CM-6 (Configuration
  Settings); DoD DevSecOps Reference Architecture.
check: "Is secret scanning integrated into the CI/CD pipeline, and are all credentials sourced from a vault rather than embedded in code, images, or config?"
detection_logic: >
  Run secret-scanning tooling against the full git history of all repositories in scope, not
  just HEAD. Scan all container image layers for embedded secrets. Monitor vault access logs for
  anomalous access patterns indicating credential theft.
risk_assessment: >
  High if secret scanning is not integrated into the CI/CD pipeline. Critical if live credentials
  are found in a public or broadly-accessible repository.
false_positives: >
  All credential references in source code are confirmed to be references to vault paths or
  environment variable names only -- no literal secret values are present -- validated by
  automated secret scanning with zero findings. Not applicable to an asset that IS itself the
  vault/secrets-broker (see match condition: an asset carrying the native `vault` technology
  attribute never matches this rule, since that asset's whole purpose is to hold the credential
  data this rule is about leaking elsewhere).

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - is_vault: false
      - if:
          any:
            in: "{tech_asset.technologies}"
            true: "{.attributes.vault}"
          then:
            - assign:
                is_vault: true
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - false: "{is_vault}"
            # data:credential is a tag, not a native field -- Threagile's DataAsset schema has
            # no native concept of "this is credential-shaped data" to substitute it with (see
            # the fork's own risk-methodology notes for why this one category keeps a tag read
            # where the other 8 in this batch went fully native).
            - contains:
                item: "data:credential"
                in: "{tech_asset.tags}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Hardcoded Credentials and Secrets Sprawl</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "very-likely" (the ceiling), so only the downward (RAA < 15) delta is
    # reachable.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: likely
            else:
              - return: very-likely

    # STRIDE is Information-Disclosure -> Confidentiality. Baseline is "high".
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - cia_rank: low
        - if:
            equal:
              first: "{tech_asset.confidentiality}"
              second: restricted
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: very-high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - if:
                  true: "{mission_critical}"
                  then:
                    - return: very-high
                  else:
                    - return: high
        - if:
            true: "{mission_critical}"
            then:
              - return: high
            else:
              - return: medium
