id: hardcoded-credentials-secrets-sprawl
title: Hardcoded Credentials and Secrets Sprawl
function: architecture
stride: information-disclosure
finding_class: weakness-shown
cwe: 798
description: >
  This asset authenticates to another asset with a static secret (a password, an API key, or a
  private key) that it must be able to read. Such secrets end up in source code, images, or
  configuration files, and copies persist across git history, image layers, and build caches after
  rotation.
impact: >
  If this risk remains unmitigated, a discovered secret provides immediate authenticated access to
  the resource it protects. Additionally, automated scanning often finds such a secret within hours
  of its exposure.
asvs: "V2 - Authentication / V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
action: 'Rotate any exposed secrets immediately. Then, eliminate all hardcoded credentials by migrating to a vault-backed secrets management solution.'
mitigation: >-
  Enforce secret scanning before commit and in the CI/CD pipeline, to block credential commits at
  the source.

  Migrate every secret to a hardware-backed vault, and inject it at runtime through a managed
  identity, never through environment variables in manifests or values baked into images.

  Where the target supports it, replace the static secret entirely with an issued, short-lived token
  (a managed identity or workload identity federation).

  Enforce RBAC on vault access policies scoped to individual workload identities, and implement
  secret rotation schedules.

  Audit the git history and container image layers for historical secret exposure.
references: >-
  CWE-798 (Use of Hard-Coded Credentials); MITRE ATT&CK T1552.001 (Unsecured Credentials:
  Credentials In Files); CAPEC-191 (Read Sensitive Constants Within an Executable); NIST SP 800-53
  IA-5 (Authenticator Management) and CM-6 (Configuration Settings); DoD DevSecOps Reference
  Architecture
check: 'Is secret scanning integrated into the CI/CD pipeline, and are all credentials sourced from a vault, rather than embedded in code, images, or configuration?'
detection_logic: >
  Run secret-scanning tooling against the full git history of every repository in scope, not only
  HEAD. Additionally, scan every container image layer for embedded secrets. Finally, monitor the
  vault access logs for anomalous access patterns that indicate credential theft.
risk_assessment: >
  High if secret scanning is not integrated into the CI/CD pipeline. However, the finding is
  Critical if live credentials are found in a public or broadly accessible repository.
false_positives: >
  Every credential reference in the source code is confirmed to point only to a vault path or an
  environment variable name, with no literal secret values present, as validated by automated secret
  scanning with zero findings. In that case, dispose of the finding through risk_tracking. This rule
  fires on any in-scope asset, other than a vault-technology asset, that has an outgoing
  communication link whose authentication is `credentials` or `client-certificate`, the two
  Threagile authentication values that require the asset itself to hold a static secret. By
  contrast, `token` does not fire, since Threagile defines it as a server-generated token, meaning
  one issued at runtime rather than stored. Thus, model a static API key or shared secret as
  `credentials`, not `token`, or this rule cannot see it. Additionally, likelihood steps down one
  level when the asset also has an outgoing link to a vault, which is the model's signal that
  secrets are fetched at runtime rather than embedded.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - is_vault: false
          - holds_static_secret: "has_static_secret_link({tech_asset})"
      - if:
          any:
            in: "{tech_asset.technologies}"
            true: "{.attributes.vault}"
          then:
            - assign:
                is_vault: true
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - false: "{is_vault}"
            - true: "{holds_static_secret}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Hardcoded Credentials and Secrets Sprawl</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True when any outgoing link authenticates with a secret the asset itself must hold.
    # Only non-zero enum values are compared, so the omitempty pitfall (zero values vanish on
    # re-serialization) does not apply here.
    has_static_secret_link:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - if:
                  or:
                    - equal:
                        first: "{link.authentication}"
                        second: credentials
                    - equal:
                        first: "{link.authentication}"
                        second: client-certificate
                  then:
                    - return: true
        - return: false

    # True when any outgoing link targets a vault-technology asset: the model's signal that
    # this asset fetches its secrets at runtime rather than embedding them.
    has_vault_link:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - if:
                  any:
                    in: "{$model.technical_assets.{link.target_id}.technologies}"
                    true: "{.attributes.vault}"
                  then:
                    - return: true
        - return: false

    # Likelihood: likely baseline plus the RAA and internet steps, one level lower with a vault link.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - assign:
            - step: 0
            - uses_vault: "has_vault_link({tech_asset})"
        - if:
            true: "{uses_vault}"
            then:
              - assign:
                  step: -1
        - return: "adjust_likelihood(likely, {tech_asset}, {step})"

    # Impact: medium baseline plus the CIA step on C (STRIDE information-disclosure).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.confidentiality})"
