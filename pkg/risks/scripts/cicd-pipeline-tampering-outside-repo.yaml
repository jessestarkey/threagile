id: cicd-pipeline-tampering-outside-repo
title: CI/CD Pipeline and Admission-Policy Tampering Outside Repository Trail
function: operations
stride: tampering
finding_class: control-not-evidenced
cwe: 1357
description: >
  An identity with access to the CI/CD platform's own console can modify the pipeline definition or
  its gate policies directly. In doing so, it bypasses the source-controlled pipeline file and
  leaves no pull-request trail.
impact: >
  If this risk remains unmitigated, a security gate can be silently disabled outside code review.
  Thus, the gate that a reviewer approved is no longer the one that actually runs.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html"
action: 'Restrict who can modify this pipeline''s definition, or its admission and gate policies, directly through the CI/CD platform''s console or API. Additionally, log every such change, even when it does not originate from a repository commit.'
mitigation: >
  Where the CI/CD platform allows pipeline or policy edits outside the repository (through the
  console UI or direct API calls), restrict that capability to a minimal administrative group that
  is distinct from ordinary contributors. Additionally, forward every such change to the SIEM,
  regardless of whether it originated from a commit. Where the platform supports it, prefer a
  configuration that sources the pipeline definition exclusively from the repository, namely true
  pipeline-as-code with no console override capability. References include NIST SP 800-218 (Secure
  Software Development Framework, PO.3 and PS.1) and NIST SP 800-53 CM-3 (Configuration Change
  Control).
check: 'Are pipeline and policy edits made outside the repository restricted to a minimal administrative group and logged to the SIEM?'
detection_logic: >
  Audit the CI/CD platform's access-control configuration for who can edit pipeline definitions or
  gate policies outside a repository commit. Then, confirm that such changes are forwarded to the
  SIEM.
risk_assessment: >
  High for any pipeline where a non-administrative identity can alter the pipeline definition or
  gate policies outside the repository's pull-request trail.
false_positives: >
  This rule fires on every in-scope build pipeline asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once pipeline and policy edits outside the repository are confirmed to be restricted to a minimal
  administrative group and logged to the SIEM.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.build-pipeline}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>CI/CD Pipeline and Admission-Policy Tampering Outside Repository Trail</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset.raa})"

    # Impact: medium baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
