id: ai-cascading-agent-failures
title: "Cascading Agent Failures"
function: architecture
stride: denial-of-service
cwe: 400
description: >
  An AI agent hands work to another agent -- an outgoing link from an agent orchestrator or
  multi-agent gateway to another one. In a chain of agents, one agent's error, hallucinated
  result, runaway loop, or compromised output becomes the next agent's trusted input, so a single
  fault propagates and amplifies across the chain instead of staying contained where it started.
impact: >
  If this risk remains unmitigated, one failing or manipulated agent can exhaust the resources,
  corrupt the work, or stall the operation of every agent downstream of it, taking out the whole
  agent workflow rather than one step of it.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
action: "Contain faults at every agent-to-agent hand-off with validation, bounded retries and recursion, timeouts, and circuit breakers."
mitigation: >
  Treat every message from another agent as untrusted input: validate its structure and bounds
  before acting on it. Cap delegation depth, fan-out, retries, and total tool calls per workflow,
  and give every hand-off a timeout. Add circuit breakers that stop sending work to an agent that
  is failing or behaving anomalously, with a defined degraded mode instead of retrying
  indefinitely. Isolate each agent's resource budget so one runaway agent cannot starve the
  others. Trace each workflow end to end so a fault can be located and the chain halted.
  References: OWASP Top 10 for Agentic Applications 2026 ASI08 (Cascading Agent Failures);
  MITRE ATLAS AML.T0029 (Denial of AI Service), AML.T0034 (Cost Harvesting); MAESTRO layers 4, 5
  and 7; CWE-400, CWE-674, CWE-703, CWE-755; NIST SP 800-53 SC-5, SC-7, SI-4, IR-4 (mappings via
  the OWASP GenAI Security Crosswalk 2026-Q3, https://github.com/GenAI-Security-Project/crosswalk).
check: "Is every agent-to-agent hand-off validated and bounded (depth, fan-out, retries, timeouts), with circuit breakers and per-agent resource budgets that stop a fault from propagating down the chain?"
detection_logic: >
  Map every agent-to-agent hand-off and review its validation, limits, and timeout settings.
  Inject a malformed or looping response at one agent in a test environment and observe whether
  downstream agents contain it. Monitor workflow traces for runaway delegation depth or fan-out.
risk_assessment: >
  High when the chain reaches agents with critical-or-higher availability and has no circuit
  breakers or delegation limits. Medium otherwise.
false_positives: >
  Fires on an in-scope ai-agent-orchestrator or ai-multi-agent-gateway with an outgoing link to
  another ai-agent-orchestrator or ai-multi-agent-gateway. A single agent that only calls models
  and tools does not fire. Dispose of a confirmed-compliant asset through risk_tracking: log it as
  mitigated once every hand-off in the chain is confirmed validated, bounded, and behind a
  circuit breaker.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - is_agent: false
          - delegates: "has_agent_link({tech_asset})"
      - if:
          any:
            in: "{tech_asset.technologies}"
            or:
              - true: "{.attributes.ai-agent-orchestrator}"
              - true: "{.attributes.ai-multi-agent-gateway}"
          then:
            - assign:
                is_agent: true
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - true: "{is_agent}"
            - true: "{delegates}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Cascading Agent Failures</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: improbable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    is_agent_target:
      parameters:
        - target_id
      do:
        - if:
            any:
              in: "{$model.technical_assets.{target_id}.technologies}"
              or:
                - true: "{.attributes.ai-agent-orchestrator}"
                - true: "{.attributes.ai-multi-agent-gateway}"
            then:
              - return: true
        - return: false

    has_agent_link:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - assign:
                  - to_agent: "is_agent_target({link.target_id})"
              - if:
                  true: "{to_agent}"
                  then:
                    - return: true
        - return: false

    # Availability rank: 2 for "high" (critical / mission-critical), 1 for "mid" (important),
    # 0 otherwise -- the same CIA-rank bands every other rule's impact delta uses.
    availability_rank:
      parameters:
        - availability
      do:
        - if:
            or:
              - equal:
                  first: "{availability}"
                  second: critical
              - equal:
                  first: "{availability}"
                  second: mission-critical
            then:
              - return: high
        - if:
            equal:
              first: "{availability}"
              second: important
            then:
              - return: mid
        - return: low

    # New category (no replaced rule to inherit from). Baseline is "possible": a cascade needs a
    # triggering fault or manipulation at one agent plus missing containment at the hand-off, and
    # no published statistic rates agent-chain cascades yet, so this is analyst judgment. All
    # three outcomes (unlikely/possible/likely) are reachable via the RAA delta.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: unlikely
            else:
              - if:
                  equal-or-greater:
                    first: "{tech_asset.raa}"
                    second: 40
                  then:
                    - return: likely
                  else:
                    - return: possible

    # STRIDE is Denial-of-Service -> Availability. Baseline is "medium". A cascade takes out the
    # chain, so the rank is the max Availability over this asset and every agent it hands work
    # to: "high" if any is critical or higher, "medium" if any is important, otherwise "low".
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - best: "availability_rank({tech_asset.availability})"
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - assign:
                  - to_agent: "is_agent_target({link.target_id})"
              - if:
                  true: "{to_agent}"
                  then:
                    - assign:
                        - target_availability: "{$model.technical_assets.{link.target_id}.availability}"
                    - assign:
                        - target_rank: "availability_rank({target_availability})"
                    - if:
                        equal:
                          first: "{target_rank}"
                          second: high
                        then:
                          - assign:
                              best: high
                    - if:
                        and:
                          - equal:
                              first: "{target_rank}"
                              second: mid
                          - equal:
                              first: "{best}"
                              second: low
                        then:
                          - assign:
                              best: mid
        - if:
            equal:
              first: "{best}"
              second: high
            then:
              - return: high
        - if:
            equal:
              first: "{best}"
              second: mid
            then:
              - return: medium
        - return: low
