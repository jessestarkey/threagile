id: ai-supply-chain-compromise
title: "AI Supply Chain Compromise"
function: architecture
stride: tampering
cwe: 1357
description: >
  This asset loads third-party AI components it did not build: model weights, adapters, and
  tokenizers from a model hub or registry, agent frameworks and their dependency trees, or tool
  servers and their packages. Any of them can be malicious, swapped, or silently updated -- model
  files that execute code on load, poisoned or backdoored weights, a typo-squatted or hijacked
  package, a reclaimed hub namespace -- and they run with this asset's full privileges.
impact: >
  If this risk remains unmitigated, one compromised component gives an attacker code execution
  on every host that loads it, or a model whose behaviour they control, across every system
  built on the same component.
asvs: "V15 - Secure Coding and Architecture"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
action: "Admit AI components only from approved sources, pin and verify each by hash or signature, and scan them before they are loaded."
mitigation: >
  Pull models, adapters, frameworks, and tool packages only from an internal, access-controlled
  registry or mirror, never directly from a public hub at load time. Pin every component to an
  exact version and verify it by hash or signature on every load; reject floating tags and
  unpinned dependencies. Prefer non-executable model formats (safetensors) and scan artifacts
  for embedded code, unsafe deserialization, and known-malicious content before admission.
  Maintain an AI bill of materials (models, datasets, frameworks, tools) per deployment, and
  watch for namespace takeovers and suspicious new versions of components you depend on. Load
  third-party components with the least privilege the task needs. References: OWASP LLM Top 10
  2026 LLM04 (Supply Chain); OWASP Top 10 for Agentic Applications 2026 ASI04 (Agentic Supply
  Chain); OWASP Agentic Skills Top 10 2026 AST02 (Supply Chain Compromise); MITRE ATLAS
  AML.T0010 (AI Supply Chain Compromise), AML.T0011.000 (Unsafe AI Artifacts); MAESTRO layers 3
  and 4; CWE-1357, CWE-494, CWE-829; NIST SP 800-53 SR-3, SR-4, SA-9, SI-7 (mappings via the
  OWASP GenAI Security Crosswalk 2026-Q3, https://github.com/GenAI-Security-Project/crosswalk).
check: "Are models, frameworks, and tool packages admitted only from an approved internal registry, pinned and hash- or signature-verified on every load, scanned before admission, and tracked in an AI bill of materials?"
detection_logic: >
  Inventory every third-party model, adapter, framework, and tool package each deployment loads,
  and where it is fetched from at runtime. Check for floating tags, unpinned dependencies, and
  executable model formats. Review admission scanning results and the AI bill of materials.
risk_assessment: >
  Critical when components are pulled from a public hub or package index at load time without
  pinning or verification. High when pulled through an internal registry without scanning.
false_positives: >
  Fires on every in-scope ai-model-registry, ai-model-serving, ai-agent-orchestrator, and
  ai-tool-server asset, because each loads third-party AI components. Likelihood steps up one
  level when the asset brings content in from outside its trust boundary -- internet: true, an
  incoming link from an asset in a different directly containing trust boundary (or none), or an
  outgoing readonly link (a pull, e.g. from a public model hub) to such an asset. Dispose of a
  confirmed-compliant asset through risk_tracking: log it as mitigated once approved-source
  admission, pinning with verification, scanning, and an AI bill of materials are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.ai-model-registry}"
                  - true: "{.attributes.ai-model-serving}"
                  - true: "{.attributes.ai-agent-orchestrator}"
                  - true: "{.attributes.ai-tool-server}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>AI Supply Chain Compromise</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True when content can come in from outside the trust boundary: the asset is
    # internet-facing, an incoming link comes from an asset in a different directly containing
    # trust boundary, or an outgoing readonly link (a pull) goes to one. A missing boundary
    # counts as different from a present one.
    brings_in_from_outside:
      parameters:
        - tech_asset
      do:
        - if:
            true: "{tech_asset.internet}"
            then:
              - return: true
        - assign:
            - own_boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{tech_asset.id}.id}"
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              - assign:
                  - source_boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{link.source_id}.id}"
              - if:
                  not-equal:
                    first: "{source_boundary}"
                    second: "{own_boundary}"
                  then:
                    - return: true
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - assign:
                  - target_boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{link.target_id}.id}"
              - if:
                  and:
                    - true: "{link.readonly}"
                    - not-equal:
                        first: "{target_boundary}"
                        second: "{own_boundary}"
                  then:
                    - return: true
        - return: false

    # Baseline is "possible", shared by all four replaced rules. Two independent one-level
    # steps up: content brought in from outside the trust boundary, and RAA >= 40. RAA < 15
    # steps down one level.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - assign:
            - outside: "brings_in_from_outside({tech_asset})"
        - if:
            equal-or-greater:
              first: "{tech_asset.raa}"
              second: 40
            then:
              - if:
                  true: "{outside}"
                  then:
                    - return: very-likely
              - return: likely
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - if:
                  true: "{outside}"
                  then:
                    - return: possible
              - return: unlikely
        - if:
            true: "{outside}"
            then:
              - return: likely
        - return: possible

    # STRIDE is Tampering -> Integrity. Baseline is "very-high" (the ceiling, shared by all four
    # replaced rules), so only the downward step is reachable: "high" when this asset's own
    # Integrity is operational or archive, otherwise "very-high".
    get_impact:
      parameters:
        - tech_asset
      do:
        - if:
            or:
              - equal:
                  first: "{tech_asset.integrity}"
                  second: important
              - equal:
                  first: "{tech_asset.integrity}"
                  second: critical
              - equal:
                  first: "{tech_asset.integrity}"
                  second: mission-critical
            then:
              - return: very-high
        - return: high
