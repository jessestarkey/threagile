id: unscanned-data-store
title: Unclassified or Unscanned Data Store
function: architecture
stride: information-disclosure
cwe: 200
description: >
  A persistent data store has never been run through an automated classification scan, so no
  sensitivity label attaches to the data it holds.
impact: >
  If this risk remains unmitigated, downstream controls that depend on that label -- encryption
  tier, access policy, DLP, retention -- apply a default posture that may not match the data's
  true sensitivity.
asvs: "V8 - Data Protection"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html"
action: "Enroll the data store in an automated discovery/classification scan and apply the resulting sensitivity labels before any classification-driven control is configured."
mitigation: >
  Run an automated classification/discovery scan (e.g., Microsoft Purview, Azure Information
  Protection scanner) against the store on a recurring schedule, not just at provisioning. Attach
  the resulting sensitivity labels to the asset's metadata so downstream controls (encryption
  tier, access policy, DLP, retention) can be driven by the label rather than by an assumption
  made at design time. Re-scan after any bulk import, migration, or schema change that could
  introduce new data categories. References: NIST SP 800-53 RA-2 (Security Categorization); DoDI
  5200.48 (Controlled Unclassified Information); CNSSI 1253 (Security Categorization for National
  Security Systems).
check: "Has the data store's contents been scanned and labeled by an approved classification tool on a documented recurring schedule tied to data change events?"
detection_logic: >
  Query the classification tool's coverage report for this asset's storage account/database and
  alert if no scan has completed within the defined interval, or if the asset holds data but
  carries no sensitivity label at all.
risk_assessment: >
  High for any data store holding CUI or PII where no classification scan has ever been run or
  where the last scan predates the most recent significant data change.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope datastore asset, by
  design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it as
  mitigated once the store's contents are confirmed scanned and labeled on a documented recurring
  schedule.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.type}"
                second: datastore
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Unclassified or Unscanned Data Store</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "likely" (a mid tier, not an edge), so all 3 outcomes (possible/likely/
    # very-likely) are reachable via the RAA delta.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: possible
            else:
              - if:
                  equal-or-greater:
                    first: "{tech_asset.raa}"
                    second: 40
                  then:
                    - return: very-likely
                  else:
                    - return: likely

    # STRIDE is Information-Disclosure -> Confidentiality. Baseline is "medium".
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - cia_rank: low
        - if:
            equal:
              first: "{tech_asset.confidentiality}"
              second: restricted
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - if:
                  true: "{mission_critical}"
                  then:
                    - return: high
                  else:
                    - return: medium
        - if:
            true: "{mission_critical}"
            then:
              - return: medium
            else:
              - return: low
