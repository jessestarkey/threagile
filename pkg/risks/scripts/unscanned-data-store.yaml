id: unscanned-data-store
title: Unclassified or Unscanned Data Store
function: architecture
stride: information-disclosure
finding_class: control-not-evidenced
cwe: 200
description: >
  A persistent data store has never been run through an automated classification scan. Thus, no
  sensitivity label attaches to the data it holds.
impact: >
  If this risk remains unmitigated, the downstream controls that depend on that label, namely the
  encryption tier, access policy, DLP, and retention, apply a default posture that may not match the
  data's true sensitivity.
asvs: "V8 - Data Protection"
cheat_sheet: "https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final"
action: 'Enroll the data store in an automated discovery and classification scan, and apply the resulting sensitivity labels before any classification-driven control is configured.'
mitigation: >-
  Run an automated classification and discovery scan (for example, Microsoft Purview or the Azure
  Information Protection scanner) against the store on a recurring schedule, not only at
  provisioning.

  Attach the resulting sensitivity labels to the asset's metadata, so that the downstream controls
  (the encryption tier, access policy, DLP, and retention) are driven by the label, rather than by
  an assumption made at design time.

  Re-scan after any bulk import, migration, or schema change that could introduce new categories of
  data.
references: >-
  NIST SP 800-53 RA-2 (Security Categorization); DoDI 5200.48 (Controlled Unclassified
  Information); CNSSI 1253 (Security Categorization for National Security Systems)
check: 'Have the data store''s contents been scanned and labeled by an approved classification tool, on a documented recurring schedule tied to data change events?'
detection_logic: >
  Query the classification tool's coverage report for this asset's storage account or database.
  Then, alert if no scan has completed within the defined interval, or if the asset holds data but
  carries no sensitivity label at all.
risk_assessment: >
  High for any data store that holds CUI or PII, where no classification scan has ever been run, or
  where the last scan predates the most recent significant data change.
false_positives: >
  This rule fires on every in-scope datastore asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once the
  store's contents are confirmed to be scanned and labeled on a documented recurring schedule.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.type}"
                second: datastore
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Unclassified or Unscanned Data Store</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset.raa})"

    # Impact: low baseline plus the CIA step on C (STRIDE information-disclosure).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.confidentiality})"
