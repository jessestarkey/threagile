id: key-storage-ownership-hardening-gap
title: Key Storage and Ownership Hardening Gap
function: architecture
stride: information-disclosure
finding_class: control-not-evidenced
cwe: 320
description: >
  This secrets or key management asset holds consequential key material that is either (1) generated
  only in software, rather than in a hardware-backed root of trust, or (2) encrypted under a
  platform-managed key when policy requires a customer-managed one.
impact: >
  If this risk remains unmitigated, a compromised host that generated a software-only key yields the
  key material directly, with no hardware boundary to cross.
asvs: "V6 - Cryptography"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
action: 'Generate and store consequential keys in an HSM-backed service rather than in software, and confirm that the key ownership tier (customer-managed or platform-managed) matches this asset''s data classification requirement.'
mitigation: >-
  Generate and store keys that protect CUI, or signing and root credentials, in a hardware-backed
  key vault (for example, a Premium or Managed HSM tier, or an equivalent), rather than in
  application memory or a software keystore.

  Where policy requires customer control over key material for a given classification tier,
  provision the resource with a customer-managed key (CMK) in that hardware-backed vault, rather
  than accepting the platform's default platform-managed key (PMK).

  Verify this for each resource, since PMK is frequently the default, and it satisfies "encrypted at
  rest" scans without satisfying the ownership requirement.
references: >-
  NIST SP 800-53 SC-12 (Cryptographic Key Establishment and Management); NIST SP 800-57
  (Recommendation for Key Management); FIPS 140-3
check: 'Are consequential keys generated and held in a hardware-backed vault, with the key ownership tier (CMK or PMK) matching this asset''s data classification requirement?'
detection_logic: >
  Audit the key vault's resource configuration for HSM-backed key generation, and for whether keys
  are customer-managed or platform-managed. Then, cross-reference the result against this asset's
  data classification requirement.
risk_assessment: >
  High for any asset that generates or holds keys protecting CUI in software rather than in a
  hardware-backed vault, or where a classification tier that requires CMK is provisioned with a
  platform-managed key instead.
false_positives: >
  This rule fires on every in-scope vault asset by design, so no tag suppresses it. Instead, dispose
  of a confirmed-compliant asset through risk_tracking, logging it as mitigated once consequential
  keys are confirmed to be generated and held in a hardware-backed vault, with the key ownership
  tier verified against this asset's data classification requirement.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.vault}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Key Storage and Ownership Hardening Gap</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset.raa})"

    # Impact: low baseline plus the CIA step on C (STRIDE information-disclosure).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.confidentiality})"
