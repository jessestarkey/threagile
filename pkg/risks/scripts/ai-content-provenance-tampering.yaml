id: ai-content-provenance-tampering
title: "Content Provenance Watermark Stripping and Forged Credential Insertion"
function: operations
stride: tampering
finding_class: control-not-evidenced
cwe: 345
description: >
  A service that embeds or verifies content-provenance or watermarking metadata on AI-generated or
  AI-processed content is subject to two distinct failures. First, routine format conversion,
  recompression, or cropping can strip the metadata without detection. Second, a forged or replayed
  provenance credential can be inserted, so that tampered or synthetic content appears authentically
  sourced.
impact: >
  If this risk remains unmitigated, downstream consumers that trust a provenance or watermark signal
  as proof of authenticity can be made to accept tampered or fully synthetic content as genuine.
  Alternatively, they can be made to discard authentic content once its signal has been silently
  stripped.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: 'Sign provenance credentials cryptographically, so that stripping is detectable as a missing signature rather than a silent absence. Additionally, verify signatures against a trusted issuer list before any content is treated as authenticated.'
mitigation: >-
  Issue provenance or watermark credentials under a cryptographic signature tied to a specific,
  auditable issuer, rather than as a bare metadata tag that silently disappears under re-encoding.

  Verify that signature against a trusted issuer list at consumption time, rather than treating the
  mere presence of provenance-shaped metadata as sufficient.

  Log each verification outcome (valid, missing, or invalid signature) distinctly, since a missing
  signal and a forged one require different responses.

  Where content is expected to keep its provenance through a known processing pipeline (for example,
  a CDN resize step), confirm that the pipeline re-signs or otherwise preserves the chain rather
  than silently dropping it.
references: >-
  NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST AI RMF MANAGE 4.1;
  C2PA Technical Specification (Content Credentials)
check: 'Are provenance credentials cryptographically signed under an auditable issuer and verified against a trusted issuer list at consumption, and are missing-signature and invalid-signature outcomes logged distinctly?'
detection_logic: >
  Audit the provenance service's issuance process for cryptographic signing versus bare metadata
  tagging. Additionally, review the verification logs for the rate of missing versus invalid
  signature outcomes, and confirm that both are surfaced rather than treated identically. Finally,
  spot-check content that has passed through a known re-encoding step for continuity of the
  provenance chain.
risk_assessment: >
  High for any provenance or watermarking service whose issued credentials are not cryptographically
  signed, or whose consumers do not verify them against a trusted issuer list.
false_positives: >
  This rule fires on every in-scope AI content provenance service asset by design, so no tag
  suppresses it. Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it
  as mitigated once cryptographic signing and trusted-issuer verification are confirmed active.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.ai-content-provenance-service}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Content Provenance Watermark Stripping and Forged Credential Insertion</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: medium baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
