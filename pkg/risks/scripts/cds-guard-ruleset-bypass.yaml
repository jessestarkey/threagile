id: cds-guard-ruleset-bypass
title: "CDS Guard Filter Rule-Set Staleness and Undocumented Bypass Path"
function: operations
stride: tampering
finding_class: control-not-evidenced
cwe: 693
description: >
  A cross-domain solution guard's entire release decision rests on two things: (1) its
  content-inspection rule set (classification-marking patterns, malware signatures, and dirty-word
  and regex lists), and (2) the absence of any path around that inspection. Thus, a stale rule set
  or an undocumented administrative override quietly defeats the guard's one job, without appearing
  as an outage.
impact: >
  If this risk remains unmitigated, content that the guard's rule set was never updated to catch, or
  content pushed through an undocumented bypass, crosses the classification boundary with the same
  apparent assurance as properly inspected content, since nothing distinguishes the two downstream.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: 'Keep the guard''s inspection rule set on a documented review and update cadence, and confirm that no administrative override path releases content without passing through it.'
mitigation: >-
  Keep the guard's marking, malware-signature, and dirty-word rule set under version control, with a
  recurring review tied to the accreditation body's revalidation schedule, since a rule set
  accredited once drifts out of step with new data types and threats.

  Audit the guard's configuration for any override, maintenance-mode, or emergency-release path that
  bypasses inspection, and require normal release-authority approval for its use.

  Log every rule-set change and bypass to a destination that the guard's administrators cannot
  modify.
references: >-
  NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity) and CM-3 (Configuration
  Change Control); DoD Raise-the-Bar Cross Domain Solution requirements
check: 'Is the guard''s inspection rule set under version control with a documented, recurring review cadence, and is every administrative override or bypass path logged and gated on the same release-authority approval as a normal transfer?'
detection_logic: >
  Audit the guard's rule-set version history for recency against its own documented review cadence.
  Additionally, review the guard's administrative configuration for any override or maintenance-mode
  capability, and confirm that its use is logged and requires release-authority approval. Finally,
  cross-reference the bypass-invocation logs against the release-authority approval records.
risk_assessment: >
  Critical for any guard whose rule set has no documented, recurring review process, or whose
  administrative bypass capability is not logged and approval-gated in the same way as a normal
  transfer.
false_positives: >
  This rule fires on every in-scope CDS guard asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once the
  rule-set review cadence, and the logging and approval of bypass paths, are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.cds-guard}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>CDS Guard Filter Rule-Set Staleness and Undocumented Bypass Path</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset.raa})"

    # Impact: medium baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
