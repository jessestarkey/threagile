id: cds-guard-ruleset-bypass
title: "CDS Guard Filter Rule-Set Staleness and Undocumented Bypass Path"
function: operations
stride: tampering
cwe: 696
description: >
  A cross-domain solution guard's entire release decision rests on its content-inspection
  rule set (classification-marking patterns, malware signatures, dirty-word/regex lists) and
  the absence of any path around that inspection. A stale rule set or an undocumented
  administrative override quietly defeats the guard's one job without appearing as an outage.
impact: >
  If this risk remains unmitigated, content the guard's rule set was never updated to catch --
  or content pushed through an undocumented bypass -- crosses the classification boundary with
  the same apparent assurance as properly inspected content, since nothing distinguishes the
  two downstream.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: "Keep the guard's inspection rule set on a documented review and update cadence, and confirm no administrative override path releases content without passing through it."
mitigation: >
  Maintain the guard's classification-marking, malware-signature, and dirty-word/regex rule set
  under version control with a documented, recurring review cadence tied to the accreditation
  body's own revalidation schedule -- a rule set accredited once and never revisited silently
  drifts out of step with new data types and threats the guard is relied upon to catch. Audit
  the guard's own administrative configuration for any override, maintenance-mode, or
  emergency-release capability that bypasses the normal inspection path, and require the same
  release-authority approval for its use as for a normal transfer. Log every rule-set change and
  every bypass invocation to a destination the guard administrators themselves cannot modify.
  References: NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP
  800-53 CM-3 (Configuration Change Control); DoD Raise-the-Bar Cross Domain Solution
  requirements.
check: "Is the guard's inspection rule set under version control with a documented recurring review cadence, and is every administrative override or bypass path logged and gated on the same release-authority approval as a normal transfer?"
detection_logic: >
  Audit the guard's rule-set version history for recency against its own documented review
  cadence. Review the guard's administrative configuration for any override or maintenance-mode
  capability and confirm its use is logged and requires release-authority approval. Cross-
  reference bypass-invocation logs against release-authority approval records.
risk_assessment: >
  Critical for any guard whose rule set has no documented recurring review process, or whose
  administrative bypass capability is not logged and approval-gated identically to a normal
  transfer.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope CDS-guard asset, by
  design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it as
  mitigated once the rule-set review cadence and bypass-path logging/approval are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.cds-guard}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>CDS Guard Filter Rule-Set Staleness and Undocumented Bypass Path</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "likely" (a mid tier, not an edge), so all 3 outcomes (possible/likely/
    # very-likely) are reachable via the RAA delta.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: possible
            else:
              - if:
                  equal-or-greater:
                    first: "{tech_asset.raa}"
                    second: 40
                  then:
                    - return: very-likely
                  else:
                    - return: likely

    # STRIDE is Tampering -> Integrity. Baseline is "very-high" (the ceiling), so only the
    # downward (Integrity low) delta is reachable -- a guard's inspection path silently failing
    # is a total failure of the one control it exists to provide, regardless of this asset's
    # own rating.
    # Impact is purely a function of this asset's own Integrity rank -- the model-wide Business
    # Criticality bump that used to apply here was removed (see git history / the sibling
    # Python engine's compute_impact() for the rationale: it mostly inflated already-peripheral
    # assets rather than protecting genuinely under-rated ones).
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - integrity_low: true
        - if:
            or:
              - equal:
                  first: "{tech_asset.integrity}"
                  second: important
              - equal:
                  first: "{tech_asset.integrity}"
                  second: critical
              - equal:
                  first: "{tech_asset.integrity}"
                  second: mission-critical
            then:
              - assign:
                  integrity_low: false
        - if:
            true: "{integrity_low}"
            then:
              - return: high
            else:
              - return: very-high
