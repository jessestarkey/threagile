id: ics-controller-unauthenticated-protocol
title: "ICS/PACS Controller Unauthenticated Industrial Protocol Command Injection"
function: architecture
stride: tampering
finding_class: control-not-evidenced
cwe: 306
description: >
  Industrial control protocols (Modbus, BACnet, and DNP3) and legacy access-control protocols
  (Wiegand) have no native authentication. Thus, a controller that speaks one of them accepts a
  command or configuration write from anyone who reaches it on the network or the wire.
impact: >
  If this risk remains unmitigated, an attacker who reaches the controller's segment or wiring can
  inject commands or rewrite its logic exactly as the legitimate control system or badge reader
  would.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: 'Segment ICS and PACS controller traffic from the general IT network, and apply the strongest authentication that the protocol supports, such as OSDP Secure Channel for access control and protocol-aware filtering for industrial protocols.'
mitigation: >-
  Place ICS and PACS controllers on a dedicated, segmented network that is isolated from the general
  IT network, with protocol-aware filtering (an industrial firewall or a protocol-aware IDS) at the
  boundary, rather than relying on the controller's own protocol to enforce anything.

  Replace legacy, unauthenticated access-control wiring (Wiegand) with OSDP Secure Channel where the
  hardware supports it, since Wiegand's cleartext credential transmission is trivially sniffed and
  replayed.

  Where the industrial protocol itself has no authentication option at all, treat network
  segmentation and physical access to the wiring as the only real controls, and document them as
  such, rather than assuming the protocol provides any assurance.
references: >-
  CWE-306 (Missing Authentication for Critical Function); MITRE ATT&CK for ICS T0855 (Unauthorized
  Command Message) and T0836 (Modify Parameter); UFC 4-010-06 (Cybersecurity of Facility-Related
  Control Systems); NIST SP 800-82 (Guide to Operational Technology Security)
check: 'Are ICS and PACS controllers segmented from the general IT network with protocol-aware filtering at the boundary, and has legacy, unauthenticated access-control wiring been replaced with an authenticated protocol where supported?'
detection_logic: >
  Audit the network segmentation of ICS and PACS controller traffic, and confirm its isolation from
  the general IT network and protocol-aware filtering at the boundary. Additionally, inventory the
  access-control hardware for Wiegand versus OSDP Secure Channel deployment.
risk_assessment: >
  Critical for any ICS or PACS controller that is reachable from the general IT network with no
  protocol-aware filtering, or for any access-control panel that still uses unauthenticated Wiegand
  wiring where OSDP Secure Channel hardware is available.
false_positives: >
  This rule fires on every in-scope ICS controller asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once network segmentation and the strongest available protocol authentication are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.ics-controller}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>ICS/PACS Controller Unauthenticated Industrial Protocol Command Injection</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset})"

    # Impact: high baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.integrity})"
