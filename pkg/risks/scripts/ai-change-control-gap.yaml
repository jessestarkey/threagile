id: ai-change-control-gap
title: "AI Change Control Gap"
function: operations
stride: tampering
cwe: 284
description: >
  What this AI asset does in production is set by artifacts that change outside normal code
  review -- system prompts and other hidden instructions, model versions and fine-tuned adapters,
  agent skill and tool definitions. When those can change without version control, review,
  regression testing against known-answer canary prompts, and a tested rollback path, a silent
  or malicious change has no gate before it ships and no fast way back once it does.
impact: >
  If this risk remains unmitigated, an unreviewed prompt edit, a swapped or drifted model, or an
  updated skill can widen what the AI does or remove a safety constraint with no runtime signal,
  and a bad change keeps serving production traffic for a full redeployment cycle.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
action: "Version and review every prompt, model, and skill change, gate it on a canary prompt suite, and keep a tested rollback to the last validated version."
mitigation: >
  Store system prompts, model and adapter versions, and agent skill/tool definitions as
  versioned artifacts with the same review and approval as application code, and pin what
  production loads to a specific reviewed version -- no auto-updating skills or floating model
  tags. Keep explicit structural separation between system instructions and user or
  tool-returned content in every prompt version. Run a versioned suite of known-answer canary
  prompts (including ones that confirm guardrails are active) before promotion and on a recurring
  schedule against production, and alert on any deviation. Keep the previous validated version
  ready to serve and test the rollback, recording its time. Log which prompt, model, and skill
  version served each request. References: OWASP Agentic Skills Top 10 2026 AST07 (Update
  Drift); OWASP Top 10 for Agentic Applications 2026 ASI10 (Rogue Agents); OWASP LLM Top 10 2026
  LLM05 (Data and Model Poisoning, fine-tuning subversion) and LLM08 (Hidden Context Exposure);
  MAESTRO layers 4, 5 and 6; NIST SP 800-53 CM-3, SI-6, CP-10; NIST AI RMF GOVERN 1.5, MEASURE
  2.4, MANAGE 4.1 (mappings via the OWASP GenAI Security Crosswalk 2026-Q3,
  https://github.com/GenAI-Security-Project/crosswalk).
check: "Are prompts, model versions, and skill/tool definitions version-controlled, reviewed, and pinned; is every change gated on a canary prompt suite that also runs on a schedule in production; and is rollback to the last validated version tested?"
detection_logic: >
  Trace the current production prompt, model, and skill versions back to approved reviews. Review
  canary suite run history before promotions and in production. Request evidence of a rollback
  drill with a recorded time. Check for auto-updating skills or floating model tags.
risk_assessment: >
  High for a production AI asset whose prompts, model, or skills can change without review,
  canary testing, or a tested rollback path.
false_positives: >
  Fires on every in-scope asset with the ai-llm-endpoint, ai-model-serving, ai-rag-pipeline, or
  ai-agent-orchestrator technology, because change-control practice is not something the model
  can record. Dispose of a confirmed-compliant asset through risk_tracking: log it as mitigated
  once versioned, reviewed, pinned artifacts, a canary gate, and a tested rollback are all
  confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.ai-llm-endpoint}"
                  - true: "{.attributes.ai-model-serving}"
                  - true: "{.attributes.ai-rag-pipeline}"
                  - true: "{.attributes.ai-agent-orchestrator}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>AI Change Control Gap</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "likely" (the baseline all three replaced rules used), so all 3 outcomes
    # (possible/likely/very-likely) are reachable via the RAA delta.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: possible
            else:
              - if:
                  equal-or-greater:
                    first: "{tech_asset.raa}"
                    second: 40
                  then:
                    - return: very-likely
                  else:
                    - return: likely

    # STRIDE is Tampering -> Integrity. Baseline is "medium" (all three replaced rules). Impact
    # follows this asset's own Integrity rank: "high" for critical or higher, "medium" for
    # important, otherwise "low".
    get_impact:
      parameters:
        - tech_asset
      do:
        - if:
            or:
              - equal:
                  first: "{tech_asset.integrity}"
                  second: critical
              - equal:
                  first: "{tech_asset.integrity}"
                  second: mission-critical
            then:
              - return: high
        - if:
            equal:
              first: "{tech_asset.integrity}"
              second: important
            then:
              - return: medium
        - return: low
