id: atlas-unbounded-ai-consumption
title: "ATLAS: Unbounded AI Resource Consumption and Denial of Service"
function: architecture
stride: denial-of-service
cwe: 400
description: >
  The asset exposes an LLM or model inference API with no enforced limit on request volume,
  concurrency, or per-request context/output size, letting a single caller or small set of
  callers exhaust compute capacity and deny service to legitimate users.
impact: >
  If this risk remains unmitigated, an adversary -- or an unintentionally runaway legitimate
  client -- can degrade or fully deny inference service to legitimate users and drive unbounded
  compute/cloud spend, since each request can consume disproportionate GPU/CPU time relative to
  its cost to send.
asvs: "V11 - Business Logic"
cheat_sheet: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
action: "Enforce per-user/per-session rate limits, concurrency caps, and maximum context/output token budgets on every inference endpoint."
mitigation: >
  Apply hard per-user and per-API-key request-rate and concurrency limits at the gateway in front
  of the inference endpoint, not only inside application logic a direct caller could bypass. Cap
  maximum input context length and maximum output token count per request, and reject or truncate
  requests that exceed the limit rather than queuing them. Apply adaptive throttling that degrades
  gracefully (reduced throughput) rather than failing open under load. Monitor per-user and
  aggregate compute consumption with alerting on sustained anomalous volume. Apply a hard
  autoscaling ceiling to prevent a single abusive client from driving uncontrolled cloud spend.
  References: MITRE ATLAS AML.T0029 (Denial of AI Service); OWASP LLM10:2025 (Unbounded
  Consumption); NIST AI RMF MANAGE 2.3.
check: "Are per-user/per-API-key rate limits, concurrency caps, and max context/output token budgets all enforced at the gateway in front of this inference endpoint?"
detection_logic: >
  Monitor per-user and aggregate request volume, token consumption, and compute time against
  expected baselines. Alert on sustained throughput from a single identity or small set of
  identities disproportionate to typical usage. Track queue depth and request latency percentiles
  for degradation signals consistent with resource exhaustion.
risk_assessment: >
  High for externally accessible, unauthenticated or loosely-authenticated endpoints with no
  gateway-level throttling. Medium for internal-only endpoints or those already behind a
  general-purpose API gateway with some rate limiting.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope LLM-endpoint asset,
  by design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it as
  mitigated once per-user rate limits, concurrency caps, and token budgets are all confirmed
  enforced at the gateway layer.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.llm-endpoint}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>ATLAS: Unbounded AI Resource Consumption and Denial of Service</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: improbable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "very-likely" (the ceiling), so only the downward (RAA < 15) delta is
    # reachable.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: likely
            else:
              - return: very-likely

    # STRIDE is Denial-of-Service -> Availability. Baseline is "medium".
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - cia_rank: low
        - if:
            equal:
              first: "{tech_asset.availability}"
              second: important
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.availability}"
                  second: critical
              - equal:
                  first: "{tech_asset.availability}"
                  second: mission-critical
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - if:
                  true: "{mission_critical}"
                  then:
                    - return: high
                  else:
                    - return: medium
        - if:
            true: "{mission_critical}"
            then:
              - return: medium
            else:
              - return: low
