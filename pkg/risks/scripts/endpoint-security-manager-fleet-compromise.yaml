id: endpoint-security-manager-fleet-compromise
title: "Endpoint Security Management Console Fleet-Wide Compromise Path"
function: operations
stride: elevation-of-privilege
finding_class: control-not-evidenced
cwe: 269
description: >
  A centralized endpoint security or EDR management console pushes policy, signature updates, and
  remediation code to every endpoint it manages. Thus, compromising the console itself is equivalent
  to obtaining code execution on the entire managed fleet at once.
impact: >
  If this risk remains unmitigated, an attacker who compromises the console can push a malicious
  policy or action to every managed endpoint at once. The organization's own defensive tooling
  becomes the fastest path to compromising the fleet.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: 'Require MFA and administrative tiering for console access, and verify the integrity of policy and signature content before it is pushed to the fleet.'
mitigation: >-
  Require multi-factor authentication and a dedicated, tiered administrative account, never a
  general-purpose domain admin credential, for access to the endpoint security console.

  Verify the integrity of policy, signature, and remediation-action content before it is pushed to
  the fleet, through a code-signing or change-approval step that is distinct from the console's own
  built-in distribution mechanism.

  Monitor for policy pushes or remediation actions that originate outside documented change windows
  or approved administrative sessions, since the console's normal operation is indistinguishable
  from an attacker using it exactly as designed.
references: >-
  NIST SP 800-53 AC-6 (Least Privilege) and CM-5 (Access Restrictions for Change); DoD Endpoint
  Security Solutions (ESS) implementation guidance
check: 'Does console access require MFA and a dedicated, tiered administrative account, is pushed policy, signature, and remediation content integrity-verified before distribution, and are pushes outside documented change windows monitored?'
detection_logic: >
  Audit the console's authentication configuration for MFA and administrative tiering. Additionally,
  review the content-signing or change-approval process for pushed policy, signature, and
  remediation actions. Finally, monitor for fleet-wide pushes that occur outside documented change
  windows.
risk_assessment: >
  Critical for any endpoint security console with no MFA or tiering on administrative access, or
  with no integrity verification of the content it pushes to the fleet.
false_positives: >
  This rule fires on every in-scope endpoint security manager asset by design, so no tag suppresses
  it. Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once MFA and tiering, and content integrity verification, are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.endpoint-security-manager}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Endpoint Security Management Console Fleet-Wide Compromise Path</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset.raa})"

    # Impact: high baseline plus the CIA step on max(C,I,A) (STRIDE elevation-of-privilege).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.confidentiality}, {tech_asset.integrity}, {tech_asset.availability})"
