id: missing-data-retention-schedule
title: Missing Data Retention and Disposition Schedule
function: operations
stride: information-disclosure
finding_class: control-not-evidenced
cwe: 200
description: >
  The asset holds data with no documented retention period or disposition action tied to its
  classification type.
impact: >
  If this risk remains unmitigated, sensitive holdings can be retained indefinitely with no owner
  for their disposal. Meanwhile, records needed for a later investigation can be lost prematurely.
asvs: "V8 - Data Protection"
cheat_sheet: "https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final"
action: 'Document a retention period and a specific disposition action, not merely "delete", for each data or classification type that this asset holds, and enforce it automatically where the platform supports it.'
mitigation: >-
  Define a retention schedule for each data classification or record type, sourced from the
  applicable NARA General Records Schedule or a program-specific records disposition schedule, that
  specifies both a minimum retention period and the disposition action required at expiry.

  Automate its enforcement (for example, through lifecycle policies on the storage layer) wherever
  possible, rather than relying on manual review.

  Ensure that the schedule explicitly protects audit and provenance records for at least the minimum
  period required to support an incident investigation opened near the end of the retention window.
references: >-
  NIST SP 800-53 SI-12 (Information Management and Retention) and AU-11 (Audit Record Retention);
  NARA General Records Schedules
check: 'Does a documented retention and disposition schedule exist for every data or classification type that this asset holds, enforced automatically or verified on a recurring audit cadence?'
detection_logic: >
  Audit the storage layer's lifecycle policy configuration against the documented retention schedule
  for this asset's data and classification types. Then, confirm that the disposition actions are
  enforced, rather than merely documented.
risk_assessment: >
  Medium. However, the finding rises to High where the data that is retained too briefly or too long
  is CUI, or where audit records needed for a pending investigation have already been disposed of.
false_positives: >
  This rule fires on every in-scope datastore asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once a
  documented retention and disposition schedule is confirmed to be in place and enforced for every
  data or classification type that this asset holds.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.type}"
                second: datastore
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Missing Data Retention and Disposition Schedule</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset})"

    # Impact: low baseline plus the CIA step on C (STRIDE information-disclosure).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.confidentiality})"
