id: multi-tenant-data-isolation
title: Multi-Tenant Data Isolation Failure
function: architecture
stride: information-disclosure
finding_class: control-not-evidenced
cwe: 668
description: >
  The asset's own code serves multiple organizational tenants from a shared deployment, without
  sufficient isolation in its database queries, caching, or background job processing.
impact: >
  If this risk remains unmitigated, an authorization failure that would expose one user's data in a
  single-tenant system instead exposes an entire tenant's data to another tenant's users.
asvs: "V4 - Access Control"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html"
action: 'Enforce the tenant context in every database query and cache key, and test cross-tenant isolation on every data-access endpoint.'
mitigation: >-
  Enforce the tenant ID as a mandatory filter in every database query, at the ORM or repository
  layer.

  Implement row-level security at the database layer as a defense-in-depth backstop, and include the
  tenant context in every cache key.

  Validate the tenant context in background job processors when jobs are dequeued, not only when
  they are enqueued.

  Use opaque, non-sequential tenant identifiers.
references: >-
  NIST SP 800-53 AC-3 (Access Enforcement) and AC-4 (Information Flow Enforcement); DoD Cloud
  Multi-Tenant Security Requirements
check: 'Is the tenant ID enforced as a mandatory filter in every database query, every cache key, and every background job at dequeue time?'
detection_logic: >
  Run cross-tenant access tests in the automated test suite. Specifically, obtain authenticated
  tokens for two distinct tenants, and verify that tenant A's token cannot access any resource that
  tenant B owns. Additionally, verify that the tenant ID appears in the generated database query
  logs. Finally, test the cache isolation.
risk_assessment: >
  Critical for multi-tenant systems that handle CUI. Furthermore, the severity of an individual
  isolation failure is at least one level higher than that of an equivalent single-tenant finding.
false_positives: >
  This rule fires only on an asset that is both multi_tenant and custom_developed_parts, since
  tenant isolation in queries, caching, and jobs is code that the application team writes. A
  managed service that the provider shares among its customers is not multi_tenant in this sense.
  Additionally, the finding does not apply when each tenant's data is stored in a completely
  isolated database schema or database instance, with no shared tables, which is physical
  isolation rather than logical isolation through tenant ID filtering. In that case, dispose of
  the asset's finding through risk_tracking rather than a tag, logging it as mitigated once
  physical, or verified logical, tenant isolation is confirmed across database queries, caching,
  and background job processing.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - true: "{tech_asset.multi_tenant}"
            - true: "{tech_asset.custom_developed_parts}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Multi-Tenant Data Isolation Failure</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset})"

    # Impact: high baseline plus the CIA step on C (STRIDE information-disclosure).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.confidentiality})"
