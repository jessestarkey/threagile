id: space-ground-station-rogue-uplink
title: "Rogue Ground Station Impersonation"
function: operations
stride: spoofing
finding_class: control-not-evidenced
cwe: 306
description: >
  A ground station that uplinks commands to a spacecraft can be impersonated if command
  authentication relies on the link's obscurity rather than cryptographic verification. A rogue
  ground station can then issue commands the spacecraft accepts as legitimate.
impact: >
  If this risk remains unmitigated, an adversary with an unauthorized ground station can command the
  spacecraft directly, bypassing every control of this organization's ground segment, with no
  cryptographic check onboard.
asvs: "V9 - Communications"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html"
action: 'Authenticate every command uplink cryptographically, and monitor for command or telemetry sessions that originate from an unrecognized ground station.'
mitigation: >-
  Authenticate every command uplinked to the spacecraft cryptographically, rather than relying on
  link obscurity, frequency coordination, or physical access to the ground station alone as the
  control.

  Monitor for command or telemetry sessions that originate from an unrecognized ground station
  identity, and alert on any uplink attempt that fails authentication, rather than silently dropping
  it.

  Protect the ground station's own command-origination credentials in the same way as any other
  high-value signing key, since their compromise is functionally equivalent to legitimately
  operating a rogue ground station.
references: >-
  MITRE SPARTA (Space Attack Research and Tactic Analysis) for Rogue Ground Station and
  Unauthorized Uplink; NIST IR 8401 (Satellite Ground Segment Security); NIST SP 800-53 IA-3
  (Device Identification and Authentication)
check: 'Is every command uplink cryptographically authenticated, independent of link obscurity, and is monitoring in place for uplink attempts from an unrecognized ground station identity?'
detection_logic: >
  Audit the command-uplink protocol for cryptographic authentication, as opposed to reliance on
  obscurity, frequency coordination, or physical access alone. Additionally, review the monitoring
  coverage for uplink attempts that fail authentication or come from an unrecognized origin.
risk_assessment: >
  Critical for any ground station whose command uplink relies on link obscurity rather than
  cryptographic authentication, or where no monitoring exists for unauthorized uplink attempts.
false_positives: >
  This rule fires on every in-scope space ground station asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once cryptographic command authentication and monitoring for unauthorized uplinks are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.space-ground-station}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Rogue Ground Station Impersonation</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset.raa})"

    # Impact: high baseline plus the CIA step on I (STRIDE spoofing).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.integrity})"
