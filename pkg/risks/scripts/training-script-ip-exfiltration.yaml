id: training-script-ip-exfiltration
title: "Training Script and Feature-Engineering Pipeline IP Exfiltration"
function: architecture
stride: information-disclosure
cwe: 200
description: >
  Training scripts and feature-engineering pipelines lack the access restriction and egress
  monitoring applied to the model artifacts they produce, despite often being more valuable.
impact: >
  If this risk remains unmitigated, exfiltration of the training methodology lets an adversary
  replicate or improve on the model while triggering none of the controls built to protect the
  weights.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: "Apply the same access restriction, encryption, and bulk-clone/egress monitoring to training scripts and feature-engineering pipelines as to model weight artifacts."
mitigation: >
  Restrict read/write access to training scripts and feature-engineering code to the named
  population that needs it, encrypt the repository at rest, and monitor for bulk-clone or
  high-volume export activity against it the same way an export path for model weights or CUI
  data would be monitored. Do not treat training code as ordinary application source code
  subject only to standard repository access controls, given its distinct value as reproducible
  model methodology. References: NIST SP 800-53 SR-4 (Provenance); NIST AI RMF (MANAGE 2.3);
  NIST SP 800-53 AC-4 (Information Flow Enforcement).
check: "Are training scripts and feature-engineering code access-restricted, encrypted at rest, and monitored for bulk-clone/export activity?"
detection_logic: >
  Monitor the training/feature-engineering repository's access logs for bulk-clone or
  high-volume export patterns. Audit repository permissions against the named population
  actually requiring access.
risk_assessment: >
  High for any training/feature-engineering repository with no access restriction or egress
  monitoring beyond standard source-control defaults.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope training-pipeline
  asset, by design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it
  as mitigated once training scripts and feature-engineering code are confirmed access-restricted,
  encrypted at rest, and monitored for bulk-clone/export activity.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.training-pipeline}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Training Script and Feature-Engineering Pipeline IP Exfiltration</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "likely" (a mid tier, not an edge), so all 3 outcomes (possible/likely/
    # very-likely) are reachable via the RAA delta.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: possible
            else:
              - if:
                  equal-or-greater:
                    first: "{tech_asset.raa}"
                    second: 40
                  then:
                    - return: very-likely
                  else:
                    - return: likely

    # STRIDE is Information-Disclosure -> Confidentiality. Baseline is "medium".
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - cia_rank: low
        - if:
            equal:
              first: "{tech_asset.confidentiality}"
              second: restricted
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - if:
                  true: "{mission_critical}"
                  then:
                    - return: high
                  else:
                    - return: medium
        - if:
            true: "{mission_critical}"
            then:
              - return: medium
            else:
              - return: low
