id: vulnerable-outdated-dependency
title: "Vulnerable and Outdated Third-Party Dependency"
function: architecture
stride: tampering
finding_class: control-not-evidenced
cwe: 1395
description: >
  This asset's custom code pulls in third-party libraries, and unless their versions are checked
  continuously against vulnerability databases, a known-vulnerable one can ship. Container
  base-image scanning and End-of-Life tracking cover other layers, not this dependency graph.
impact: >
  If this risk remains unmitigated, a disclosed vulnerability in a dependency stays exploitable in
  production for as long as it goes undetected, even when a fix is already available upstream.
asvs: "V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
action: 'Integrate automated Software Composition Analysis (SCA) into the CI/CD pipeline, scanning this asset''s full application-level dependency graph against a current known-vulnerability database on every build.'
mitigation: >-
  Integrate an SCA tool (for example, Dependabot, Snyk, OWASP Dependency-Check, or OSV-Scanner) into
  the CI/CD pipeline. Specifically, scan the complete dependency graph, including transitive
  dependencies and not only direct ones, on every build, and on a recurring schedule for newly
  disclosed CVEs against the versions already deployed.

  Fail the build on Critical or High findings above the organization's accepted threshold, and
  maintain a documented remediation SLA tied to severity.

  Subscribe to the security advisories for the package registry ecosystem (npm, PyPI, Maven Central,
  or NuGet) that this asset uses.
references: >-
  CWE-1104 (Use of Unmaintained Third Party Components); OWASP Top 10:2025 A03 (Software Supply
  Chain Failures); NIST SP 800-53 RA-5 (Vulnerability Monitoring and Scanning); MITRE ATT&CK T1190
  (Exploit Public-Facing Application)
check: 'Is an SCA tool integrated into the CI/CD pipeline, scanning this asset''s full transitive dependency graph against a current known-vulnerability database on every build and on a recurring schedule?'
detection_logic: >
  Confirm that an SCA tool runs in the CI/CD pipeline for this asset's build, and that its scan
  report covers the full transitive dependency tree, not only the direct dependencies. Then,
  cross-reference the dependency manifest or lockfile against a recent SCA scan timestamp, to flag
  drift between what is actually deployed and what was last scanned.
risk_assessment: >
  High for any custom-developed asset with no SCA tooling integrated into its build pipeline.
  However, the finding rises to Critical if a dependency with a known, actively exploited CVE is
  confirmed present in a production deployment.
false_positives: >
  This rule fires on every in-scope asset with custom-developed parts by design, so no tag
  suppresses it. Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it
  as mitigated once an SCA tool is confirmed to be integrated into this asset's CI/CD pipeline, with
  a documented remediation SLA.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  # custom_developed_parts (the native per-asset field, not a technology attribute) is the right
  # signal here: this risk is specifically about scanning the dependency graph of code this team
  # actually wrote, not a vendor/COTS product's own internal dependencies, which the app team
  # neither sees nor controls.
  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - true: "{tech_asset.custom_developed_parts}"
            # in-house assets only: external-entity is the zero value of type and drops out, so
            # test for process or datastore
            - or:
                - equal:
                    first: "{tech_asset.type}"
                    second: process
                - equal:
                    first: "{tech_asset.type}"
                    second: datastore
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Vulnerable and Outdated Third-Party Dependency</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: medium baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
