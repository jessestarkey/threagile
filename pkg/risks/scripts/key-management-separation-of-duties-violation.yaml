id: key-management-separation-of-duties-violation
title: Key Management Separation-of-Duties Violation
function: architecture
stride: elevation-of-privilege
finding_class: control-not-evidenced
cwe: 269
description: >
  A single identity can both perform key operations and administer or audit the same key vault's
  access policy and activity log.
impact: >
  If this risk remains unmitigated, a single compromised or malicious identity can both misuse a key
  and erase the trace of that misuse, with no independent party positioned to notice.
asvs: "V6 - Cryptography"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
action: 'Ensure that no single identity holds both key-operation permissions and the ability to modify this key vault''s own access policy or audit configuration.'
mitigation: >-
  Assign the key vault's management-plane permissions (to create, rotate, and delete keys, and to
  modify the access policy) and its data-plane permissions (to use a key for cryptographic
  operations) to distinct roles held by different individuals.

  Route access-policy changes to the vault itself through a change process that requires a second
  approver.

  Forward the vault's audit log to a destination that the vault's own administrators cannot delete
  or modify, so that a change to a key-management role is independently visible.
references: >-
  NIST SP 800-53 AC-5 (Separation of Duties) and SC-12 (Cryptographic Key Establishment and
  Management)
check: 'Are key-operation permissions and vault administration and audit permissions held by distinct roles or individuals?'
detection_logic: >
  Audit the key vault's access-policy assignments for any identity that holds both key-operation and
  management-plane permissions. Then, confirm that the audit log's destination is independent of the
  vault's own administrators.
risk_assessment: >
  High for any key vault where a single identity holds both key-operation permissions and vault
  administration or audit permissions.
false_positives: >
  This rule fires on every in-scope vault asset by design, so no tag suppresses it. Instead, dispose
  of a confirmed-compliant asset through risk_tracking, logging it as mitigated once key-operation
  permissions and vault administration and audit permissions are confirmed to be held by distinct
  roles or individuals.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.vault}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Key Management Separation-of-Duties Violation</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset})"

    # Impact: low baseline plus the CIA step on max(C,I,A) (STRIDE elevation-of-privilege).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.confidentiality}, {tech_asset.integrity}, {tech_asset.availability})"
