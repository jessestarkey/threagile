id: key-management-separation-of-duties-violation
title: Key Management Separation-of-Duties Violation
function: architecture
stride: elevation-of-privilege
cwe: 269
description: >
  A single identity can both perform key operations and administer or audit that same key
  vault's access policy and activity log.
impact: >
  If this risk remains unmitigated, a single compromised or malicious identity can both misuse a
  key and erase the trace of that misuse, with no independent party positioned to notice.
asvs: "V6 - Cryptography"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
action: "Ensure no single identity holds both key-operation permissions and the ability to modify this key vault's own access policy or audit configuration."
mitigation: >
  Assign key vault management-plane permissions (create/rotate/delete keys, modify access policy)
  and data-plane permissions (use a key for cryptographic operations) to distinct roles held by
  different individuals. Route access-policy changes to the vault itself through a change process
  requiring a second approver. Forward the vault's audit log to a destination this vault's own
  administrators cannot delete or modify, so a key-management role change is independently
  visible. References: NIST SP 800-53 AC-5 (Separation of Duties); NIST SP 800-53 SC-12
  (Cryptographic Key Establishment and Management).
check: "Are key-operation and vault-administration/audit permissions held by distinct roles or individuals?"
detection_logic: >
  Audit the key vault's access-policy assignments for any identity holding both key-operation and
  management-plane permissions, and confirm the audit log destination is independent of the
  vault's own administrators.
risk_assessment: >
  High for any key vault where a single identity holds both key-operation and vault-
  administration/audit permissions.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope vault asset, by
  design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it as
  mitigated once key-operation and vault-administration/audit permissions are confirmed held by
  distinct roles or individuals.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.vault}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Key Management Separation-of-Duties Violation</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "unlikely" (the floor), so only the upward (RAA >= 40) delta is reachable.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            equal-or-greater:
              first: "{tech_asset.raa}"
              second: 40
            then:
              - return: possible
            else:
              - return: unlikely

    # STRIDE is Elevation-of-Privilege, which falls back to the max rank across all three CIA
    # dimensions. Baseline is "medium".
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - cia_rank: low
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: restricted
              - equal:
                  first: "{tech_asset.integrity}"
                  second: important
              - equal:
                  first: "{tech_asset.availability}"
                  second: important
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
              - equal:
                  first: "{tech_asset.integrity}"
                  second: critical
              - equal:
                  first: "{tech_asset.integrity}"
                  second: mission-critical
              - equal:
                  first: "{tech_asset.availability}"
                  second: critical
              - equal:
                  first: "{tech_asset.availability}"
                  second: mission-critical
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - if:
                  true: "{mission_critical}"
                  then:
                    - return: high
                  else:
                    - return: medium
        - if:
            true: "{mission_critical}"
            then:
              - return: medium
            else:
              - return: low
