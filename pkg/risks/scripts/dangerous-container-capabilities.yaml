id: dangerous-container-capabilities
title: Dangerous Container Linux Capabilities
function: operations
stride: elevation-of-privilege
finding_class: control-not-evidenced
cwe: 250
description: >
  The container is granted Linux capabilities beyond what its function requires, such as
  CAP_SYS_ADMIN, CAP_NET_ADMIN, or CAP_SYS_PTRACE.
impact: >
  If this risk remains unmitigated, an attacker can use these capabilities to escape the container,
  manipulate network traffic, or extract credentials from other processes that share the node.
asvs: "V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html"
action: 'Drop all capabilities, and add back only the specific capabilities that the workload''s function requires.'
mitigation: >-
  Set securityContext.capabilities.drop: [ALL] in the container spec, and add back only the specific
  capabilities that are required.

  Enforce this through a Kubernetes admission controller that blocks the deployment of containers
  with disallowed capabilities.

  Apply AppArmor or seccomp profiles to further restrict the system call surface.
references: >-
  DISA Kubernetes STIG (K8S-00-000150); NIST SP 800-53 CM-7 (Least Functionality); CIS Kubernetes
  Benchmark
check: 'Does the container drop all Linux capabilities and add back only those its function requires, with an admission controller blocking containers that request disallowed capabilities?'
detection_logic: >
  Integrate a Kubernetes capability audit into the CI/CD pipeline. Additionally, run Trivy or
  Kubescape against every running workload, and alert on capability violations. Finally, monitor the
  kernel audit logs for container processes whose cap_effective flags exceed the expected set.
risk_assessment: >
  High for containers with CAP_SYS_ADMIN or CAP_SYS_PTRACE, and Medium for CAP_NET_ADMIN or
  CAP_NET_RAW. All of these are CAT II STIG findings.
false_positives: >
  This rule fires on every in-scope container asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once all
  capabilities have been dropped and only the explicitly required ones are granted again, enforced
  by admission controller policy.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.machine}"
                second: container
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Dangerous Container Linux Capabilities</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset})"

    # Impact: medium baseline plus the CIA step on max(C,I,A) (STRIDE elevation-of-privilege).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.confidentiality}, {tech_asset.integrity}, {tech_asset.availability})"
