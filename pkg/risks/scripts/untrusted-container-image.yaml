id: untrusted-container-image
title: Untrusted Container Image Supply Chain
function: architecture
stride: tampering
finding_class: control-not-evidenced
cwe: 1357
description: >
  The container image's provenance is not explicitly verified as coming from a trusted, scanned
  registry. Thus, a vulnerable or backdoored base image or layer can reach production. This rule
  also covers what Threagile's built-in container-baseimage-backdooring rule raised, since that rule
  fired on the same containers for the same risk.
impact: >
  If this risk remains unmitigated, the image may introduce known CVEs or supply-chain malware into
  the ATO boundary. The consequence matches that of a compromised CI/CD dependency, since an
  attacker-controlled artifact runs with the workload's own privileges. Thus, it is rated the same
  here, rather than at a lesser tier because the artifact is a container image instead of a package.
asvs: "V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
action: 'Migrate image sourcing to a trusted, DoD-approved registry, and enforce cryptographic verification at deploy time.'
mitigation: >
  Source all base and application images exclusively from a DoD-approved, continuously scanned
  registry (for example, Iron Bank). Additionally, enforce SHA-256 digest pinning in every manifest,
  and prohibit mutable tags such as :latest. Require Sigstore or Cosign signature verification
  through an admission controller (Kyverno, or OPA Gatekeeper's image-verification policy) before
  any pod is scheduled. Finally, run Trivy or Grype against every image in the CI/CD pipeline, and
  fail the build on Critical or High CVEs above the organization's accepted threshold. References
  include the DISA Kubernetes STIG, NIST SP 800-53 SA-12 (Supply Chain Protection) and SR-3 (Supply
  Chain Controls and Processes), and SLSA (Supply-chain Levels for Software Artifacts).
check: 'Is the image sourced only from a DoD-approved, scanned registry, pinned by digest, and signature-verified by an admission controller before it is scheduled?'
detection_logic: >
  Audit the admission controller's image-verification policy (a Kyverno ClusterPolicy or a
  Gatekeeper ConstraintTemplate) to confirm that it rejects unsigned or non-digest-pinned images.
  Additionally, cross-reference the registry's own pull audit log for images sourced outside the
  approved-registry allowlist.
risk_assessment: >
  High for images pulled from an unvetted public registry into an ATO boundary. Even a DoD-approved
  registry does not fully close the gap without digest pinning and signature verification enforced
  at deploy time, since an approved image can still be silently swapped after approval.
false_positives: >
  This rule fires on every in-scope container asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once the
  image is confirmed to be sourced exclusively from a DoD-approved, scanned registry, with digest
  pinning and admission-controller signature verification enforced.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.machine}"
                second: container
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Untrusted Container Image Supply Chain</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: medium baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
