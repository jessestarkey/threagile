id: key-rotation-escrow-neglect
title: Key Rotation and Escrow Neglect
function: operations
stride: information-disclosure
finding_class: control-not-evidenced
cwe: 320
description: >
  Key rotation for this asset is manual and inconsistently performed, and no tested escrow or
  recovery procedure exists for a customer-managed key.
impact: >
  If this risk remains unmitigated, a key that is never rotated has an ever-growing, undetected
  exposure window, and an untested recovery procedure can mean permanent loss of access when it is
  needed.
asvs: "V6 - Cryptography"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
action: 'Enforce a scheduled key rotation policy for this asset''s keys, and test the escrow and recovery procedure for any customer-managed key at least annually.'
mitigation: >-
  Configure automated key rotation on a defined cadence (for example, every 90 to 180 days for
  data-encryption keys), rather than relying on manual rotation.

  For customer-managed keys, establish a documented escrow and recovery procedure (for example, a
  split-knowledge backup, or an HSM-to-HSM export under dual control), and actually exercise it on a
  recurring schedule through a full recovery drill rather than a paper review, since an unexercised
  procedure has the same failure mode as having none.
references: >-
  NIST SP 800-53 SC-12 (Cryptographic Key Establishment and Management); NIST SP 800-57 Part 1
  (Key Management, General)
check: 'Is key rotation automated on a documented schedule, and has the escrow and recovery procedure for any customer-managed key been exercised within the current period?'
detection_logic: >
  Audit the key vault's rotation policy configuration for automated rotation. Additionally, request
  evidence that the escrow and recovery procedure for any customer-managed key was actually
  exercised, not merely documented.
risk_assessment: >
  High for customer-managed keys with no tested recovery procedure. However, the finding is Medium
  for manual-only rotation of platform-managed keys.
false_positives: >
  This rule fires on every in-scope vault asset by design, so no tag suppresses it. Instead, dispose
  of a confirmed-compliant asset through risk_tracking, logging it as mitigated once key rotation is
  confirmed to be automated on a documented schedule, and the escrow and recovery procedure has been
  exercised within the current period.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.vault}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Key Rotation and Escrow Neglect</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset})"

    # Impact: low baseline plus the CIA step on C (STRIDE information-disclosure).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.confidentiality})"
