id: ai-unbounded-consumption
title: "Unbounded Consumption"
function: operations
stride: denial-of-service
finding_class: weakness-shown
cwe: 400
description: >
  An LLM endpoint or AI gateway answers requests from outside its trust boundary, and every request
  costs compute and money. Without per-caller limits, anyone who reaches it can (1) exhaust its
  capacity, (2) run up spend on stolen credentials, or (3) flood it with chaff that buries real
  activity.
impact: >
  If this risk remains unmitigated, the AI service becomes unavailable or unaffordable for
  legitimate users, spend can reach thousands of dollars a day before anyone notices, and review
  queues drown in noise.
asvs: "V2 - Validation and Business Logic"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html"
action: 'Put per-caller rate limits, token and cost budgets, and input-size limits in front of every AI endpoint that is reachable from outside its boundary, with spend alerting.'
mitigation: >-
  Front every externally reachable AI endpoint with an AI gateway, or an equivalent, that
  authenticates callers and enforces per-identity rate limits, concurrency limits, and token and
  cost budgets.

  Cap input and output sizes and context length, and reject or truncate pathologically expensive
  requests.

  Set hard spend limits and alerts at the provider and at the gateway.

  Monitor for volume spikes, repetitive near-duplicate requests, and credential misuse, and be able
  to revoke a caller quickly.

  Degrade gracefully when limits are hit, rather than failing open.
references: >-
  OWASP LLM Top 10 2026 LLM06 (Unbounded Consumption); OWASP GenAI Data Security 2026 DSGAI17
  (Data Availability and Resilience Failures); OWASP API Security Top 10 API4:2023 (Unrestricted
  Resource Consumption); MITRE ATLAS AML.T0029 (Denial of AI Service), AML.T0034 (Cost
  Harvesting), and AML.T0046 (Spamming AI System with Chaff Data); MAESTRO layers 3, 4, and 5;
  CWE-400; CWE-770; CWE-799; NIST SP 800-53 SC-5, SC-7, and SI-4; Mappings from the OWASP GenAI
  Security Crosswalk 2026-Q3 (https://github.com/GenAI-Security-Project/crosswalk)
check: 'Does every externally reachable AI endpoint enforce authenticated, per-identity rate, concurrency, token, and cost limits, with input-size caps, hard spend limits, and alerting?'
detection_logic: >
  Review the rate, token, and cost limits on the endpoint and on any gateway in front of it, as well
  as the provider's spend limits and alerts. Then, load-test from a single identity to confirm that
  the limits engage. Finally, monitor usage for spikes, repetitive requests, and unexpected callers.
risk_assessment: >
  High for an internet-facing AI endpoint with no per-caller limits or spend alerting, or for one
  that supports availability-critical work. Otherwise, the finding is Medium.
false_positives: >
  This rule fires on an in-scope ai-llm-endpoint or ai-gateway that is internet-facing, or that has
  an incoming link from an outside caller. An outside caller is an external entity, an
  internet-facing or out-of-scope asset, or a frontend (a web application, reverse proxy, WAF, load
  balancer, or client) in a different network boundary, and as in Threagile's own rules,
  execution-environment boundaries are looked through to the enclosing network boundary. Thus, an
  LLM endpoint reached only through internal services, such as an ai-gateway that relays outside
  traffic, does not fire, since the gateway carries the finding. Dispose of a confirmed-compliant
  asset through risk_tracking, logging it as mitigated once per-caller limits, budgets, input caps,
  and spend alerting are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - exposed: "receives_from_outside({tech_asset})"
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.ai-llm-endpoint}"
                  - true: "{.attributes.ai-gateway}"
            - true: "{exposed}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Unbounded Consumption</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: improbable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True when the asset is internet-facing, or an incoming link comes from an outside caller
    # (see is_outside_caller).
    receives_from_outside:
      parameters:
        - tech_asset
      do:
        - if:
            true: "{tech_asset.internet}"
            then:
              - return: true
        - assign:
            - own_boundary: "network_boundary({tech_asset.id})"
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              - assign:
                  - outside: "is_outside_caller({link.source_id}, {own_boundary})"
              - if:
                  true: "{outside}"
                  then:
                    - return: true
        - return: false

    # --- Exposure helpers (shared text; the DSL has no cross-file helpers) ---
    # Network boundary of an asset, following the network-only semantics of Threagile's own
    # built-in rules: its directly containing trust boundary, or, when that is an
    # execution-environment boundary, the nearest enclosing boundary that is not (up to three
    # levels). Empty when the asset is in no boundary. network-on-prem is the zero value of the
    # boundary type and is dropped on re-serialization, so "not execution-environment" is tested.
    network_boundary:
      parameters:
        - asset_id
      do:
        - assign:
            - boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{asset_id}.id}"
        - if:
            not-equal:
              first: "{$model.trust_boundaries.{boundary}.type}"
              second: execution-environment
            then:
              - return: "{boundary}"
        - assign:
            - boundary: "parent_boundary({boundary})"
        - if:
            not-equal:
              first: "{$model.trust_boundaries.{boundary}.type}"
              second: execution-environment
            then:
              - return: "{boundary}"
        - assign:
            - boundary: "parent_boundary({boundary})"
        - if:
            not-equal:
              first: "{$model.trust_boundaries.{boundary}.type}"
              second: execution-environment
            then:
              - return: "{boundary}"
        - assign:
            - boundary: "parent_boundary({boundary})"
        - return: "{boundary}"

    # Id of the trust boundary that nests the given one, or empty.
    parent_boundary:
      parameters:
        - child
      do:
        - loop:
            in: "{$model.trust_boundaries}"
            item: candidate
            do:
              - if:
                  contains:
                    item: "{child}"
                    in: "{candidate.trust_boundaries_nested}"
                  then:
                    - return: "{candidate.id}"
        - return: ""

    # True for an asset outside the organization's own systems: internet-facing, out of scope,
    # or an external entity (the zero value of type, dropped on re-serialization, so "neither
    # process nor datastore" is tested).
    is_external:
      parameters:
        - asset_id
      do:
        - if:
            or:
              - true: "{$model.technical_assets.{asset_id}.internet}"
              - true: "{$model.technical_assets.{asset_id}.out_of_scope}"
              - and:
                  - not-equal:
                      first: "{$model.technical_assets.{asset_id}.type}"
                      second: process
                  - not-equal:
                      first: "{$model.technical_assets.{asset_id}.type}"
                      second: datastore
            then:
              - return: true
        - return: false

    is_frontend_asset:
      parameters:
        - asset_id
      do:
        - if:
            any:
              in: "{$model.technical_assets.{asset_id}.technologies}"
              true: "{.attributes.frontend_related}"
            then:
              - return: true
        - return: false

    # True when a caller brings outside requests or content in: it is external, or it is a
    # frontend (web application, reverse proxy, WAF, client, ...) in a different network
    # boundary from the given one.
    is_outside_caller:
      parameters:
        - caller_id
        - own_boundary
      do:
        - assign:
            - external: "is_external({caller_id})"
        - if:
            true: "{external}"
            then:
              - return: true
        - assign:
            - frontend: "is_frontend_asset({caller_id})"
            - caller_boundary: "network_boundary({caller_id})"
        - if:
            and:
              - true: "{frontend}"
              - not-equal:
                  first: "{caller_boundary}"
                  second: "{own_boundary}"
            then:
              - return: true
        - return: false

    # Likelihood: likely baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset})"

    # Impact: medium baseline plus the CIA step on A (STRIDE denial-of-service).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.availability})"
