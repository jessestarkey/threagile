id: ai-unbounded-consumption
title: "Unbounded Consumption"
function: operations
stride: denial-of-service
cwe: 400
description: >
  An LLM endpoint or AI gateway answers requests from outside its trust boundary, and every
  request costs real compute, tokens, and money. Without per-caller limits, anyone who can reach
  it can exhaust capacity with volume or deliberately expensive prompts, run up spend on stolen
  or shared credentials (denial of wallet), or flood it with chaff that buries real activity and
  overwhelms human review.
impact: >
  If this risk remains unmitigated, the AI service becomes unavailable or unaffordable for its
  legitimate users, spend can run to thousands of dollars a day before anyone notices, and
  monitoring and review queues are drowned in noise.
asvs: "V2 - Validation and Business Logic"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html"
action: "Put per-caller rate limits, token and cost budgets, and input-size limits in front of every AI endpoint reachable from outside its boundary, with spend alerting."
mitigation: >
  Front every externally reachable AI endpoint with an AI gateway or equivalent that
  authenticates callers and enforces per-identity rate limits, concurrency limits, and token and
  cost budgets. Cap input and output sizes and context length, and reject or truncate
  pathologically expensive requests. Set hard spend limits and alerts at the provider and gateway.
  Monitor for volume spikes, repetitive near-duplicate requests, and credential misuse, and be
  able to revoke a caller quickly. Degrade gracefully rather than failing open when limits are
  hit. References: OWASP LLM Top 10 2026 LLM06 (Unbounded Consumption); OWASP GenAI Data Security
  2026 DSGAI17 (Data Availability and Resilience Failures); OWASP API Security Top 10 API4:2023
  (Unrestricted Resource Consumption); MITRE ATLAS AML.T0029 (Denial of AI Service), AML.T0034
  (Cost Harvesting), AML.T0046 (Spamming AI System with Chaff Data); MAESTRO layers 3, 4 and 5;
  CWE-400, CWE-770, CWE-799; NIST SP 800-53 SC-5, SC-7, SI-4 (mappings via the OWASP GenAI
  Security Crosswalk 2026-Q3, https://github.com/GenAI-Security-Project/crosswalk).
check: "Does every externally reachable AI endpoint enforce authenticated, per-identity rate, concurrency, token, and cost limits, with input-size caps, hard spend limits, and alerting?"
detection_logic: >
  Review rate, token, and cost limits on the endpoint and any gateway in front of it, and the
  provider's spend limits and alerts. Load-test from a single identity to confirm limits engage.
  Monitor usage for spikes, repetitive requests, and unexpected callers.
risk_assessment: >
  High for an internet-facing AI endpoint with no per-caller limits or spend alerting, or one
  supporting availability-critical work. Medium otherwise.
false_positives: >
  Fires on an in-scope ai-llm-endpoint or ai-gateway that receives requests from outside its
  trust boundary -- internet: true, or an incoming link from an asset in a different directly
  containing trust boundary (or none). Likelihood steps down one level for an ai-llm-endpoint
  whose every incoming link comes from an ai-gateway (where limits are expected to be enforced).
  Dispose of a confirmed-compliant asset through risk_tracking: log it as mitigated once
  per-caller limits, budgets, input caps, and spend alerting are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - exposed: "receives_from_outside({tech_asset})"
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.ai-llm-endpoint}"
                  - true: "{.attributes.ai-gateway}"
            - true: "{exposed}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Unbounded Consumption</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: improbable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True when the asset is internet-facing, or any incoming link comes from an asset whose
    # directly containing trust boundary differs from this asset's (a missing boundary counts as
    # different from a present one).
    receives_from_outside:
      parameters:
        - tech_asset
      do:
        - if:
            true: "{tech_asset.internet}"
            then:
              - return: true
        - assign:
            - own_boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{tech_asset.id}.id}"
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              - assign:
                  - source_boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{link.source_id}.id}"
              - if:
                  not-equal:
                    first: "{source_boundary}"
                    second: "{own_boundary}"
                  then:
                    - return: true
        - return: false

    # True for an LLM endpoint that is not internet-facing, has at least one incoming link, and
    # whose every incoming link comes from an ai-gateway asset.
    fronted_by_gateway:
      parameters:
        - tech_asset
      do:
        - if:
            true: "{tech_asset.internet}"
            then:
              - return: false
        - assign:
            - any_link: false
            - all_gateway: true
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              - assign:
                  - any_link: true
                  - from_gateway: false
              - if:
                  any:
                    in: "{$model.technical_assets.{link.source_id}.technologies}"
                    true: "{.attributes.ai-gateway}"
                  then:
                    - assign:
                        from_gateway: true
              - if:
                  false: "{from_gateway}"
                  then:
                    - assign:
                        all_gateway: false
        - if:
            and:
              - true: "{any_link}"
              - true: "{all_gateway}"
            then:
              - return: true
        - return: false

    # Baseline is "likely", the lower of the two adjacent replaced baselines
    # (atlas-unbounded-ai-consumption "very-likely", atlas-chaff-data-spamming "likely"), since
    # merged categories never take the highest. Steps: RAA (+1 at >= 40, -1 below 15) and,
    # for an LLM endpoint fronted only by a gateway, -1.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - assign:
            - fronted: false
        - if:
            any:
              in: "{tech_asset.technologies}"
              true: "{.attributes.ai-llm-endpoint}"
            then:
              - assign:
                  fronted: "fronted_by_gateway({tech_asset})"
        - if:
            equal-or-greater:
              first: "{tech_asset.raa}"
              second: 40
            then:
              - if:
                  true: "{fronted}"
                  then:
                    - return: likely
              - return: very-likely
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - if:
                  true: "{fronted}"
                  then:
                    - return: unlikely
              - return: possible
        - if:
            true: "{fronted}"
            then:
              - return: possible
        - return: likely

    # STRIDE is Denial-of-Service -> Availability. Baseline is "medium" (both replaced rules).
    # Impact follows this asset's own Availability: "high" for critical or higher, "medium" for
    # important, otherwise "low".
    get_impact:
      parameters:
        - tech_asset
      do:
        - if:
            or:
              - equal:
                  first: "{tech_asset.availability}"
                  second: critical
              - equal:
                  first: "{tech_asset.availability}"
                  second: mission-critical
            then:
              - return: high
        - if:
            equal:
              first: "{tech_asset.availability}"
              second: important
            then:
              - return: medium
        - return: low
