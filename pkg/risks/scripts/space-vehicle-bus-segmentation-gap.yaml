id: space-vehicle-bus-segmentation-gap
title: "Space Vehicle Onboard Command Authentication and Bus Segmentation Gap"
function: architecture
stride: spoofing
finding_class: control-not-evidenced
cwe: 284
description: >
  The spacecraft's own command-and-data-handling subsystem is the last line of defense if
  ground-segment controls are ever bypassed or spoofed. Yet it is frequently assumed to be secure by
  inheritance from the ground segment, rather than independently authenticating commands at the
  vehicle itself. Furthermore, if the onboard bus has no segmentation between
  command-and-data-handling and the rest of the vehicle, a validated command can reach other
  subsystems or payloads with no isolation.
impact: >
  If this risk remains unmitigated, a command that reaches the spacecraft through any path other
  than the intended ground station, whether through a compromised ground segment or a flaw
  elsewhere, is accepted. It can then reach attitude control, the payload, or other critical
  subsystems, with nothing onboard to stop it.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: 'Authenticate commands at the spacecraft''s own receiver, independent of ground-segment controls, and segment the command-and-data-handling subsystem from the other onboard buses and payloads.'
mitigation: >
  Require the spacecraft's own command-and-data-handling subsystem to authenticate every command it
  receives cryptographically, independent of any trust already established by the ground segment. In
  other words, the vehicle should not assume that a command is legitimate solely because it arrived
  through the expected uplink path. Additionally, segment the command-and-data-handling subsystem
  from attitude control, the payload, and other critical buses, so that a single accepted but
  malicious command cannot reach every subsystem at once. Since the vehicle cannot be physically
  patched or re-hardened after launch, validate this architecture during pre-launch integration and
  test, rather than relying on an on-orbit fix. References include MITRE SPARTA (Space Attack
  Research and Tactic Analysis) for the space segment's command and data handling techniques, NIST
  IR 8401 (Satellite Ground Segment Security, including its space segment considerations), and NIST
  SP 800-53 SC-7 (Boundary Protection).
check: 'Does the spacecraft''s own command-and-data-handling subsystem authenticate every command cryptographically, independent of ground-segment trust, and is it segmented from the other onboard buses and payloads?'
detection_logic: >
  Review the spacecraft's command-authentication design for independence from ground-segment trust,
  as opposed to implicit inheritance. Additionally, audit the onboard bus architecture for
  segmentation between command-and-data-handling and the other critical subsystems.
risk_assessment: >
  Critical for any space vehicle whose onboard command authentication is not independently verified
  at the vehicle itself, or whose command-and-data-handling subsystem has no segmentation from the
  other onboard buses.
false_positives: >
  This rule fires on every in-scope space vehicle asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once
  independent onboard command authentication and bus segmentation are confirmed during pre-launch
  integration and test.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.space-vehicle}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Space Vehicle Onboard Command Authentication and Bus Segmentation Gap</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset.raa})"

    # Impact: high baseline plus the CIA step on I (STRIDE spoofing).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.integrity})"
