id: media-sanitization-procedure-gap
title: Media Sanitization Procedure Gap
function: operations
stride: information-disclosure
finding_class: control-not-evidenced
cwe: 212
description: >
  This virtual machine's persistent storage has no documented sanitization procedure, aligned with
  NIST SP 800-88, for end of life, decommissioning, or repurposing.
impact: >
  If this risk remains unmitigated, CUI persists in recoverable form on a disk that is
  decommissioned, repurposed, or returned to a cloud provider or hardware vendor without verified
  sanitization.
asvs: "V8 - Data Protection"
cheat_sheet: "https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final"
action: 'Adopt and document a sanitization procedure for this asset''s storage, aligned with NIST SP 800-88, and exercise it at decommissioning, repurposing, or hardware return.'
mitigation: >
  Before decommissioning, repurposing, or returning hardware to a vendor, adopt a documented
  sanitization procedure for this asset's persistent storage that is aligned with NIST SP 800-88.
  Specifically, use cryptographic erase where the disk supports it, and otherwise a verified
  multi-pass wipe. Additionally, log every sanitization event with the method used and who verified
  it. References include NIST SP 800-53 MP-6 (Media Sanitization), NIST SP 800-88 (Guidelines for
  Media Sanitization), and DoD 5200.01.
check: 'Is a documented sanitization procedure, aligned with NIST SP 800-88, in place for this asset''s storage?'
detection_logic: >
  Confirm that a documented sanitization procedure exists. Then, request evidence that it was
  exercised for the most recent decommissioning, repurposing, or hardware-return event involving
  this asset's storage.
risk_assessment: >
  Medium where the disk is already encrypted with organization-controlled keys, since destroying the
  key is an effective sanitization on its own. However, the finding is High where the disk is
  unencrypted, or the encryption key is not organization-controlled.
false_positives: >
  This rule fires on every in-scope virtual machine asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once a documented sanitization procedure, aligned with NIST SP 800-88, is in place and evidenced
  for this asset's storage.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.machine}"
                second: virtual
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Media Sanitization Procedure Gap</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset.raa})"

    # Impact: low baseline plus the CIA step on C (STRIDE information-disclosure).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.confidentiality})"
