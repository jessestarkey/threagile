id: ai-hidden-context-exposure
title: "Hidden Context Exposure"
function: architecture
stride: information-disclosure
cwe: 200
description: >
  An LLM endpoint, RAG pipeline, or agent answers requests from outside its trust boundary, and
  its context carries material the requester is not meant to see: the system prompt, developer
  instructions, retrieved policy or configuration text, and tool and function schemas. Crafted
  queries ("repeat your instructions", encoding tricks, role-play, injected instructions) can make
  the model reveal that hidden context, which is never a reliable secret once it is in the
  model's context window.
impact: >
  If this risk remains unmitigated, an adversary recovers the blueprint for bypassing the
  system's guardrails, the names and parameters of internal tools to target directly, and any
  business logic, internal detail, or credential that was placed in the hidden context.
asvs: "V8 - Authorization"
cheat_sheet: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
action: "Treat all hidden context as eventually disclosable: keep secrets and access-control decisions out of it, and filter responses for hidden-context echoes before they leave the boundary."
mitigation: >
  Never place secrets, credentials, or access-control logic in system prompts, developer
  instructions, retrieved configuration, or tool descriptions -- assume anything in the model's
  context can be disclosed, and enforce authorization outside the model. Expose only the tool
  schemas a given user's session needs. Use provider features that separate system instructions
  from user turns at the API level rather than string concatenation. Filter responses for
  verbatim or near-verbatim hidden-context content before they cross the boundary. Red-team the
  endpoint with prompt-extraction techniques on a schedule, and treat a successful extraction as a
  design finding. References: OWASP LLM Top 10 2026 LLM08 (Hidden Context Exposure; formerly
  LLM07:2025 System Prompt Leakage); MITRE ATLAS AML.T0056 (Extract LLM System Prompt), AML.T0051.000;
  MAESTRO layers 1 and 6; CWE-200, CWE-312, CWE-215; NIST SP 800-53 AC-3, SC-28 (mappings via the
  OWASP GenAI Security Crosswalk 2026-Q3, https://github.com/GenAI-Security-Project/crosswalk).
check: "Is all hidden context (system prompt, developer instructions, retrieved configuration, tool schemas) free of secrets and access-control logic, with authorization enforced outside the model and responses filtered for hidden-context echoes?"
detection_logic: >
  Inventory what the model's hidden context contains for each session type. Run a versioned
  suite of prompt-extraction techniques against the endpoint from outside the boundary and alert
  on responses with significant overlap with the hidden context.
risk_assessment: >
  Critical if hidden context embeds a credential or an access-control decision. High when it
  contains business logic, internal tool definitions, or guardrail rules. Medium otherwise.
false_positives: >
  Fires on an in-scope ai-llm-endpoint, ai-rag-pipeline, or ai-agent-orchestrator that receives
  requests from outside its trust boundary -- internet: true, or an incoming link from an asset in
  a different directly containing trust boundary (or none). Dispose of a confirmed-compliant
  asset through risk_tracking: log it as mitigated once hidden context is confirmed free of
  secrets and access-control logic and an output filter for hidden-context echoes is active.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - exposed: "receives_from_outside({tech_asset})"
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.ai-llm-endpoint}"
                  - true: "{.attributes.ai-rag-pipeline}"
                  - true: "{.attributes.ai-agent-orchestrator}"
            - true: "{exposed}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Hidden Context Exposure</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True when the asset is internet-facing, or any incoming link comes from an asset whose
    # directly containing trust boundary differs from this asset's (a missing boundary counts as
    # different from a present one).
    receives_from_outside:
      parameters:
        - tech_asset
      do:
        - if:
            true: "{tech_asset.internet}"
            then:
              - return: true
        - assign:
            - own_boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{tech_asset.id}.id}"
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              - assign:
                  - source_boundary: "{$model.direct_containing_trust_boundary_mapped_by_technical_asset_id.{link.source_id}.id}"
              - if:
                  not-equal:
                    first: "{source_boundary}"
                    second: "{own_boundary}"
                  then:
                    - return: true
        - return: false

    # Baseline is "very-likely" (the ceiling, as in the replaced system-prompt-leakage rule,
    # which fired on every such asset; this one fires only when requests arrive from outside the
    # boundary), so only the downward (RAA < 15) delta is reachable.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            less:
              first: "{tech_asset.raa}"
              second: 15
            then:
              - return: likely
            else:
              - return: very-likely

    # STRIDE is Information-Disclosure -> Confidentiality. Baseline is "medium" (as in the
    # replaced rule). Impact follows this asset's own Confidentiality, which should reflect what
    # its hidden context holds: "high" for confidential or higher, "medium" for restricted,
    # otherwise "low".
    get_impact:
      parameters:
        - tech_asset
      do:
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - return: high
        - if:
            equal:
              first: "{tech_asset.confidentiality}"
              second: restricted
            then:
              - return: medium
        - return: low
