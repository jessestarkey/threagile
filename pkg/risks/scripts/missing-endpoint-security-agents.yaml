id: missing-endpoint-security-agents
title: Missing Endpoint Security Agents
function: operations
stride: repudiation
finding_class: control-not-evidenced
cwe: 778
description: >
  The virtual machine lacks mandatory endpoint security agents, such as EDR or a centralized log
  forwarder.
impact: >
  If this risk remains unmitigated, an attacker can establish persistence and move laterally from
  this host without triggering any host-level SOC alert.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html"
action: 'Deploy EDR and centralized logging agents.'
mitigation: >-
  Ensure that platform policy enforces the automated deployment of an EDR agent and a centralized
  log forwarder on every VM (for example, Microsoft Defender for Endpoint and the Azure Monitor
  Agent, or the equivalent for the hosting platform).
references: >-
  CWE-778 (Insufficient Logging); NIST SP 800-53 SI-4 (System Monitoring) and SI-3 (Malicious Code
  Protection); MITRE ATT&CK TA0005 (Defense Evasion); DoD Zero Trust Reference Architecture (the
  Device pillar)
check: 'Are EDR and centralized logging agents deployed and reporting on this host?'
detection_logic: >
  Query the cloud platform's resource inventory for missing endpoint-security VM extensions, or
  check the EDR console for an active host heartbeat.
risk_assessment: >
  High, since the gap carries a high risk of undetected post-exploitation activity.
false_positives: >
  This rule fires on every in-scope virtual machine asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once EDR and log-forwarding agents are confirmed to be deployed, with an active heartbeat.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.machine}"
                second: virtual
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Missing Endpoint Security Agents</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: low baseline plus the CIA step on I (STRIDE repudiation: a detection gap lets an
    # attacker act without a trace, so the integrity of the asset is what goes unprotected).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.integrity})"
