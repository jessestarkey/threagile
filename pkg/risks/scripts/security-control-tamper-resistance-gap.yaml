id: security-control-tamper-resistance-gap
title: "Security Control Tamper Resistance Gap"
function: operations
stride: repudiation
finding_class: control-not-evidenced
cwe: 778
description: >
  This security control (a WAF, IDS/IPS, HSM, vault, or SIEM or monitoring platform) has no
  tamper-evident configuration, and no independently stored audit trail of its own. Thus, an
  adversary who gains a foothold can disable, reconfigure, or evade it, or erase the evidence of
  having done so, without that action being independently detectable outside the control itself.
impact: >
  If this risk remains unmitigated, an adversary with a foothold can blind or disable the exact
  control that would otherwise detect or block their next step, and nothing outside that control
  notices that it happened.
asvs: "V7 - Error Handling and Logging"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
action: 'Forward this control''s own configuration-change and administrative-access events to a destination that it cannot itself modify or delete, and alert on any change to its own protective configuration.'
mitigation: >-
  Send the control's administrative and configuration-change audit log to a SIEM or write-once store
  that the control's own administrators cannot modify, since adversaries routinely remove indicators
  and impair defenses (ATT&CK T1070, T1562).

  Alert on any change to the control's protective configuration (such as rule sets, a switch to
  monitor-only, or disabled log forwarding) as a high-priority event in its own right.

  Where the platform supports it, require a second approver for any change that weakens the control.

  Verify periodically with a synthetic test that the control still enforces, rather than assuming
  that uptime means it has not failed open.
references: >-
  CWE-778 (Insufficient Logging); MITRE ATT&CK T1562 (Impair Defenses) and T1070 (Indicator
  Removal); NIST SP 800-53 AU-9 (Protection of Audit Information) and SI-7 (Software, Firmware,
  and Information Integrity)
check: 'Is this control''s own configuration-change and administrative-access audit trail forwarded to a destination that it cannot itself modify, with alerting on any change to its own protective posture?'
detection_logic: >
  Monitor for configuration changes to this control (rule and policy edits, mode changes, and
  log-forwarding toggles), and alert on any such change that cannot be traced to an approved change
  record. Additionally, run periodic synthetic tests that confirm the control is still actively
  enforcing, rather than silently disabled or running in monitor-only mode.
risk_assessment: >
  High for any security control whose own administrative and configuration-change events are not
  logged independently, outside the control itself.
false_positives: >
  This rule fires on every in-scope security control asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once the control's own configuration-change audit trail is confirmed to be forwarded to a
  destination that its own administrators cannot modify, with alerting on changes to its protective
  posture.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.security_control_related}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Security Control Tamper Resistance Gap</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset.raa})"

    # Impact: low baseline plus the CIA step on I (STRIDE repudiation: a detection gap lets an
    # attacker act without a trace, so the integrity of the asset is what goes unprotected).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.integrity})"
