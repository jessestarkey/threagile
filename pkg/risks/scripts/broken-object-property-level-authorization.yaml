id: broken-object-property-level-authorization
title: Broken Object Property Level Authorization (Mass Assignment)
function: architecture
stride: tampering
finding_class: control-not-evidenced
cwe: 915
description: >
  The backend API binds request bodies directly to internal models without a per-field allow-list.
  Thus, a client can set privileged fields that the UI never exposes, or receive fields that were
  never meant to be returned.
impact: >
  If this risk remains unmitigated, a client can escalate privilege by setting a field that the
  framework silently accepts, or harvest sensitive fields that an endpoint returns unintentionally.
asvs: "V4 - Access Control"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html"
action: 'Enforce an explicit allow-list of client-writable and client-readable properties on every API endpoint, rather than binding request and response bodies directly to internal models.'
mitigation: >-
  Use explicit request and response DTOs scoped to each endpoint, rather than binding client input
  directly to internal domain or ORM models.

  Maintain an explicit allow-list of which properties a given role may write, and which properties a
  response may include, enforced on the server regardless of what the client sends.

  Include automated test cases that attempt to set privileged or internal fields through the API,
  and verify that they are rejected.
references: >-
  OWASP API Security Top 10 API3:2023; NIST SP 800-53 AC-3 (Access Enforcement); CWE-915
check: 'Does every API endpoint use explicit, per-endpoint DTOs, with a server-enforced allow-list of the properties a client may write and read?'
detection_logic: >
  Include automated API test cases that submit requests containing internal or privileged field
  names that are not in the documented request schema, and verify that the server ignores or rejects
  them. Additionally, compare each endpoint's actual JSON response against its documented response
  schema in CI.
risk_assessment: >
  High for any API that binds request bodies directly to internal models without an explicit
  per-field allow-list. However, the finding rises to Critical if a privilege-bearing field is
  client-writable without server-side filtering.
false_positives: >
  This rule fires on every in-scope request-serving API asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once every endpoint is confirmed to use explicit, per-endpoint request and response DTOs with a
  documented, server-enforced allow-list.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.request_serving_api}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Broken Object Property Level Authorization (Mass Assignment)</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset})"

    # Impact: medium baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
