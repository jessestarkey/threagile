id: cds-data-diode-unidirectionality-gap
title: "CDS Data Diode Unidirectionality Verification and Feed Integrity Gap"
function: operations
stride: tampering
finding_class: control-not-evidenced
cwe: 345
description: >
  A data diode's assurance rests on one physical property, the absence of a return path, since a
  hardware diode inspects nothing. Thus, both its one-way claim and the integrity of the forward
  feed need independent verification rather than the vendor's assertion.
impact: >
  If this risk remains unmitigated, an unverified diode could carry an undetected return channel.
  Because the diode inspects nothing, malicious content on the forward feed also reaches the
  receiving side unfiltered.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: 'Independently verify the diode''s unidirectionality on a recurring schedule, and verify content integrity on the receiving side, rather than relying on the diode for any inspection.'
mitigation: >-
  Independently test, and periodically re-verify, the diode's physical unidirectionality.

  Vendor accreditation at the initial installation is not a substitute for recurring verification,
  since a hardware fault or an unauthorized modification after installation would not report itself.

  Apply cryptographic integrity verification (signed manifests or hashes) to content on the
  receiving side of the feed, since the diode itself performs no content inspection and cannot be
  relied on to catch corruption or injected content introduced before the diode.

  Treat the sending-side system, not the diode, as responsible for any content-level assurance that
  the mission actually needs.
references: >-
  NIST SP 800-53 SC-7 (Boundary Protection) and SI-7 (Software, Firmware, and Information
  Integrity); DoD Raise-the-Bar Cross Domain Solution requirements
check: 'Is the diode''s physical unidirectionality independently verified on a recurring schedule, and is content integrity checked on the receiving side, rather than assumed from the diode''s own forwarding?'
detection_logic: >
  Audit the records of the diode's recurring, independent unidirectionality verification testing,
  which is distinct from the initial vendor accreditation. Additionally, confirm that the receiving
  side applies cryptographic integrity verification to content that arrives through the diode.
risk_assessment: >
  Critical for any data diode with no recurring, independent unidirectionality verification, or
  whose receiving side trusts arriving content with no integrity verification of its own.
false_positives: >
  This rule fires on every in-scope CDS data diode asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once recurring unidirectionality verification and receiving-side integrity checking are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.cds-data-diode}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>CDS Data Diode Unidirectionality Verification and Feed Integrity Gap</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: unlikely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(unlikely, {tech_asset.raa})"

    # Impact: high baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.integrity})"
