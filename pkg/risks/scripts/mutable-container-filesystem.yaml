id: mutable-container-filesystem
title: Mutable Container Filesystem
function: operations
stride: tampering
finding_class: control-not-evidenced
cwe: 732
description: >
  The container's root filesystem is writable, which allows an attacker who gains code execution to
  modify binaries or persist inside the container.
impact: >
  If this risk remains unmitigated, a compromised container gives an attacker a durable foothold for
  lateral movement, rather than resetting on restart.
asvs: "V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html"
action: 'Enforce readOnlyRootFilesystem.'
mitigation: >-
  Set securityContext.readOnlyRootFilesystem to true in the container's PodSecurityContext.

  Mount ephemeral emptyDir volumes for any directory that the workload genuinely needs to write to
  at runtime (for example, /tmp).

  Enforce this cluster-wide through an OPA Gatekeeper or Kyverno admission policy that rejects
  deployments without it, rather than relying on manifest review alone.
references: >-
  DISA Kubernetes STIG; NIST SP 800-53 CM-6 (Configuration Settings) and SC-39 (Process Isolation)
check: 'Does the container run with readOnlyRootFilesystem set to true, with writable paths limited to ephemeral volumes, enforced by an admission policy?'
detection_logic: >
  Query the cluster (kubectl get pods -o json), or the admission controller's policy audit log, for
  containers whose securityContext omits readOnlyRootFilesystem: true. Additionally, run Kubescape,
  or a similar CIS Kubernetes Benchmark scanner, against the running workloads.
risk_assessment: >
  Medium as a risk to node integrity in isolation. However, it compounds with any code-execution
  finding on the same container, which would otherwise reset on restart instead of persisting.
false_positives: >
  This rule fires on every in-scope container asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once the
  pod's securityContext is confirmed to set readOnlyRootFilesystem to true.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.machine}"
                second: container
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Mutable Container Filesystem</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset})"

    # Impact: low baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.integrity})"
