id: atlas-training-data-poisoning
title: "ATLAS: Training Data Poisoning and Model Backdoor Insertion"
function: architecture
stride: tampering
cwe: 349
description: >
  The training or fine-tuning pipeline ingests data from sources an adversary may be able to
  write to, such as public datasets, web scrapes, or user feedback loops.
impact: >
  If this risk remains unmitigated, a model can be backdoored to behave maliciously on specific
  trigger inputs while appearing benign on standard evaluations.
asvs: "V8 - Data Protection"
cheat_sheet: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
action: "Establish a data provenance and integrity chain for all training corpora and perform adversarial behavioral testing before every model promotion."
mitigation: >
  Maintain a signed, immutable data manifest for all training inputs. Apply statistical outlier
  detection to identify anomalous label distributions prior to training. Run a behavioral
  evaluation on an independently curated adversarial holdout set specifically targeting backdoor
  triggers before every model promotion. Apply differential privacy mechanisms during
  fine-tuning. Scrub CUI, PII, and credentials from training data using automated PII detection
  pipelines before fine-tuning. References: MITRE ATLAS AML.T0020 (Poison Training Data),
  AML.T0043.004 (Insert Backdoor Trigger), AML.T0059 (Erode Dataset Integrity); NIST AI RMF MAP
  2.3.
check: "Is a signed, immutable data manifest maintained for training inputs, with adversarial behavioral testing against a backdoor-trigger holdout set before every promotion?"
detection_logic: >
  Implement automated data validation pipelines that flag statistical anomalies in label
  distributions. Conduct post-training behavioral testing on an adversarial holdout set designed
  to surface backdoor triggers. Run membership inference probes against the trained model to
  assess CUI memorization risk before promotion.
risk_assessment: >
  High for pipelines with continuous learning, RLHF, or human-feedback-driven fine-tuning.
  Medium for static, one-time training on a controlled corpus.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope training-pipeline
  asset, by design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it
  as mitigated once a signed, immutable data manifest and adversarial backdoor-trigger testing
  are confirmed in place before every promotion.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.training-pipeline}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>ATLAS: Training Data Poisoning and Model Backdoor Insertion</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "unlikely" (the floor), so only the upward (RAA >= 40) delta is reachable.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            equal-or-greater:
              first: "{tech_asset.raa}"
              second: 40
            then:
              - return: possible
            else:
              - return: unlikely

    # STRIDE is Tampering -> Integrity. Baseline is "medium".
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - cia_rank: low
        - if:
            equal:
              first: "{tech_asset.integrity}"
              second: important
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.integrity}"
                  second: critical
              - equal:
                  first: "{tech_asset.integrity}"
                  second: mission-critical
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - if:
                  true: "{mission_critical}"
                  then:
                    - return: high
                  else:
                    - return: medium
        - if:
            true: "{mission_critical}"
            then:
              - return: medium
            else:
              - return: low
