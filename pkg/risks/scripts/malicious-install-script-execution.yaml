id: malicious-install-script-execution
title: Malicious Package Install-Script Execution on CI Runner
function: operations
stride: tampering
finding_class: control-not-evidenced
cwe: 829
description: >
  Unless this build pipeline disables them, dependency install scripts run automatically during
  resolution, before any malware or vulnerability scan examines the package.
impact: >
  If this risk remains unmitigated, a malicious dependency's install script executes arbitrary code
  on the CI runner before any downstream scan has a chance to catch it.
asvs: "V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
action: 'Suppress the automatic execution of dependency install and post-install scripts in the CI environment. Additionally, apply a cooldown between a dependency version''s publication and its adoption.'
mitigation: >
  Configure the package manager to suppress automatic install-script execution during CI dependency
  resolution (for example, npm install --ignore-scripts, or pip's build isolation with no arbitrary
  setup.py execution where avoidable), and allow only specific, reviewed exceptions for packages
  that genuinely require a build step. Additionally, apply a minimum cooldown (for example, 3 to 7
  days) between a dependency version's publication and its eligibility for use in this pipeline,
  since malicious package versions are frequently identified and pulled within days of publication.
  References include NIST SP 800-218 (Secure Software Development Framework, PW.4 and PO.5), NIST SP
  800-53 SI-3 (Malicious Code Protection), and the OWASP Software Component Verification Standard.
check: 'Is the automatic execution of dependency install scripts suppressed in CI, and is a cooldown between publication and adoption enforced?'
detection_logic: >
  Audit the package manager's CI configuration for install-script suppression flags, and for an
  enforced cooldown on newly published dependency versions.
risk_assessment: >
  Critical for any build pipeline that executes dependency install scripts automatically, with no
  cooldown on newly published versions.
false_positives: >
  This rule fires on every in-scope build pipeline asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once install-script execution is confirmed to be suppressed by default, and a cooldown between
  publication and adoption is enforced.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.build-pipeline}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Malicious Package Install-Script Execution on CI Runner</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: high baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.integrity})"
