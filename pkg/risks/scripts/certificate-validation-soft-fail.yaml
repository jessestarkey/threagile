id: certificate-validation-soft-fail
title: "Certificate Validation Service Soft-Fail Revocation Checking"
function: operations
stride: spoofing
finding_class: control-not-evidenced
cwe: 299
description: >
  A certificate-status service (an OCSP responder or a CRL distribution point) can fail open,
  treating an unreachable check as not revoked. A revoked or compromised certificate then keeps
  authenticating, especially in disconnected (DDIL) conditions, where the responder is most likely
  to be unreachable.
impact: >
  If this risk remains unmitigated, an attacker with a revoked or compromised certificate
  authenticates whenever the revocation check cannot complete, which is exactly when an attacker who
  caused the outage needs it.
asvs: "V9 - Communications"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
action: 'Configure revocation checking to fail closed, and confirm that every relying system uses a DoD-approved OCSP or CRL source, consistent with the CAC and PIV authentication requirements.'
mitigation: >-
  Configure every relying party's revocation check to fail closed. In other words, reject the
  authentication attempt when the OCSP responder or the CRL cannot be reached, or does not respond
  in time, rather than treating the absence of a definitive answer as implicit non-revocation.

  Confirm that the revocation source itself is a DoD-approved OCSP or CRL source, as CAC two-factor
  authentication of privileged users requires.

  Where degraded or disconnected (DDIL) operation is a genuine requirement, address it with a
  short-validity cached response signed by the responder, rather than an unconditional fail-open
  default.
references: >-
  CWE-299 (Improper Check for Certificate Revocation); MITRE ATT&CK T1557
  (Adversary-in-the-Middle); NIST SP 800-53 IA-5(2) (Public Key-Based Authentication) and SC-17
  (Public Key Infrastructure Certificates); DoD Cloud Computing Mission Owner Network Security
  Requirements Guide (for the CAC and OCSP revocation requirements)
check: 'Does revocation checking fail closed when the OCSP responder or CRL is unreachable, and does every relying system use a DoD-approved OCSP or CRL source?'
detection_logic: >
  Audit the relying parties' configuration for fail-open versus fail-closed behavior when a
  revocation check times out or is unavailable. Additionally, confirm that the configured OCSP or
  CRL source is on the DoD-approved list. Finally, simulate responder unavailability, and confirm
  that authentication is rejected rather than silently permitted.
risk_assessment: >
  Critical for any certificate-validation service or relying party that is configured to fail open
  on an unreachable or unresponsive revocation check.
false_positives: >
  This rule fires on every in-scope certificate validation service asset by design, so no tag
  suppresses it. Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it
  as mitigated once fail-closed behavior and a DoD-approved revocation source are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.certificate-validation-service}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Certificate Validation Service Soft-Fail Revocation Checking</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset})"

    # Impact: medium baseline plus the CIA step on I (STRIDE spoofing).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
