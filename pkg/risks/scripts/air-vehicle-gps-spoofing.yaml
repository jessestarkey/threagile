id: air-vehicle-gps-spoofing
title: "Air Vehicle GPS/PNT Spoofing-Induced Navigation Hijack and Physical Capture Data Exposure"
function: architecture
stride: spoofing
finding_class: control-not-evidenced
cwe: 290
description: >
  An air vehicle that navigates on unauthenticated civilian GPS signals can be spoofed or jammed
  into a false position that redirects, downs, or crashes it. Separately, a recovered airframe not
  built to protect its contents exposes its onboard keys and mission data.
impact: >
  If this risk remains unmitigated, an adversary can redirect or down the vehicle with a GPS
  spoofing or jamming signal. A recovered vehicle can also hand the adversary the keys and mission
  data needed to compromise the broader system.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
action: 'Cross-check GPS and PNT against an independent navigation source to detect spoofing. Additionally, ensure that anti-tamper or zeroization protects the onboard cryptographic material and mission data in the event of physical capture.'
mitigation: >-
  Cross-check the GPS or PNT position against an independent navigation source (inertial navigation,
  terrain reference, or a military anti-spoofing GPS variant where available), so that a spoofed
  civilian GPS signal is detected as a disagreement rather than silently trusted.

  Equip the vehicle with an anti-tamper or zeroization capability that destroys, or renders
  unusable, the onboard cryptographic keys and sensitive mission data if an unauthorized party
  captures or recovers the vehicle, rather than assuming that recovery will not happen.

  Define and test a documented lost-navigation failsafe behavior that is distinct from the ground
  control station's own lost-link failsafe.
references: >-
  CWE-290 (Authentication Bypass by Spoofing); Executive Order 13905 (Strengthening National
  Resilience through Responsible Use of PNT Services); NIST IR 8323 (Foundational PNT Profile);
  DHS Resilient PNT Conformance Framework; NIST SP 800-53 SR-9 (Tamper Resistance and Detection);
  DoD anti-tamper policy for unmanned systems
check: 'Does the vehicle cross-check GPS and PNT against an independent navigation source to detect spoofing, and does an anti-tamper or zeroization capability protect the onboard cryptographic material and mission data in the event of physical capture?'
detection_logic: >
  Review the vehicle's navigation architecture for independent cross-checking, as opposed to sole
  reliance on unauthenticated civilian GPS. Additionally, audit the anti-tamper and zeroization
  capability, and the test records for protecting the onboard cryptographic material and mission
  data.
risk_assessment: >
  Critical for any air vehicle that relies solely on unauthenticated civilian GPS with no
  independent navigation cross-check, or that carries cryptographic material or mission data with no
  anti-tamper or zeroization protection against physical capture.
false_positives: >
  This rule fires on every in-scope air vehicle asset by design. It covers two linked threats in one
  finding, namely (1) navigation spoofing, and (2) onboard keys and data exposed when a vehicle that
  the attack forces down, or that is lost otherwise, is recovered. Its rating is set by the
  navigation hijack, with capture as the consequence, since a second finding per vehicle would
  repeat the same path. Dispose of a confirmed-compliant asset through risk_tracking, logging it as
  mitigated once independent navigation cross-checking and anti-tamper or zeroization protection are
  both confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.air-vehicle}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Air Vehicle GPS/PNT Spoofing-Induced Navigation Hijack and Physical Capture Data Exposure</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: medium baseline plus the CIA step on I (STRIDE tampering).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
