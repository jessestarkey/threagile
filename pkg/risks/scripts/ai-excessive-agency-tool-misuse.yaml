id: ai-excessive-agency-tool-misuse
title: "Excessive Agency and Tool Misuse"
function: architecture
stride: elevation-of-privilege
finding_class: weakness-shown
cwe: 269
description: >
  An AI agent orchestrator or tool server can take actions on other assets, since it has at least
  one outgoing link that is not read-only. Thus, whatever steers the agent (a prompt injection,
  poisoned retrieved content, a malicious or over-broad tool definition, or a compromised
  orchestrator) can drive those write-capable tools to change, delete, or send data on the agent's
  authority, well beyond what the triggering request intended.
impact: >
  If this risk remains unmitigated, an adversary who influences the agent inherits every write
  action that its tools can perform, against every asset those tools reach, with the agent's own
  credentials and without a human in the loop.
asvs: "V1 - Architecture, Design and Threat Modeling"
cheat_sheet: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
action: 'Reduce each agent''s write-capable tools to the minimum, scope their permissions narrowly, and require human confirmation for consequential actions.'
mitigation: >-
  Give each agent only the tools its task needs, and make every tool read-only unless the task
  genuinely requires writes.

  Scope each tool's own credentials to the specific resources and operations it serves, rather than
  to a shared, broad-scope identity.

  Require explicit human confirmation before any agent-initiated action that writes data, sends
  communications, or changes another system.

  Maintain an immutable allowlist of callable tools, block dynamic tool registration at runtime, and
  rate-limit and budget tool invocations per session.

  Log every tool invocation with its originating prompt and the identity it ran under, and alert on
  calls that cannot be traced to a user turn.
references: >-
  OWASP LLM Top 10 2026 LLM03 (Excessive Agency); OWASP Top 10 for Agentic Applications 2026 ASI02
  (Tool Misuse and Exploitation); OWASP Agentic Skills Top 10 2026 AST03 (Over-Privileged Skills);
  OWASP GenAI Data Security 2026 DSGAI06 (Tool, Plugin and Agent Data Exchange); MITRE ATLAS
  AML.T0053 (AI Agent Tool Invocation) and AML.T0126; MAESTRO layers 3, 6, and 7; CWE-269;
  CWE-272; CWE-284; CWE-862; NIST SP 800-53 AC-3, AC-6, CM-7, and AU-2; Mappings from the OWASP
  GenAI Security Crosswalk 2026-Q3 (https://github.com/GenAI-Security-Project/crosswalk)
check: 'Is every write-capable tool that this agent can call strictly necessary, scoped to minimum permissions, gated by human confirmation for consequential actions, and logged with its originating prompt?'
detection_logic: >
  Enumerate every tool that the agent can invoke, classify each one as read-only or write-capable,
  and compare them against the task's documented needs. Additionally, review each tool's credential
  scope against the resources it actually serves. Finally, audit the tool invocation logs for write
  actions that cannot be traced to an explicit user turn, and for invocations of tools outside the
  allowlist.
risk_assessment: >
  Critical when a write-capable tool reaches an asset that holds restricted-or-higher data, or that
  has important-or-higher integrity or availability, with no human confirmation gate. However, the
  finding is High when every reachable asset is low-value.
false_positives: >
  This rule fires on any in-scope ai-agent-orchestrator that has at least one outgoing communication
  link that is not readonly and does not go to model or operational infrastructure, namely an LLM
  endpoint, model serving, an AI gateway, a guardrail, an AI observability stack, or monitoring,
  since calls to the model or to telemetry are not tool actions. It fires on an ai-tool-server under
  the same condition only when no in-scope agent orchestrator calls it, because when one does, that
  agent decides what the tools do and carries the finding. Model each tool an agent calls as a link
  from the agent (or from the ai-tool-server hosting it) to the asset the tool acts on, and mark a
  link readonly: true when the tool can only read. Thus, an agent whose tools are all read-only does
  not fire. Dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once every write-capable tool is confirmed to be necessary, minimally scoped, and gated by human
  confirmation for consequential actions.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - assign:
          - is_agent: false
          - can_write: "has_writable_link({tech_asset})"
      - if:
          any:
            in: "{tech_asset.technologies}"
            true: "{.attributes.ai-agent-orchestrator}"
          then:
            - assign:
                is_agent: true
      # A tool server only executes: when an in-scope agent calls it, that agent decides what the
      # tools do and already carries this finding. The tool server carries it only when the agent
      # steering it is not in the model (for example an MCP server used by outside agents).
      - if:
          and:
            - false: "{is_agent}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.ai-tool-server}"
          then:
            - assign:
                - steered: "called_by_in_scope_agent({tech_asset})"
            - if:
                false: "{steered}"
                then:
                  - assign:
                      is_agent: true
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - true: "{is_agent}"
            - true: "{can_write}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Excessive Agency and Tool Misuse</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # True when an in-scope agent orchestrator calls this asset.
    called_by_in_scope_agent:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{$model.incoming_technical_communication_links_mapped_by_target_id.{tech_asset.id}}"
            item: link
            do:
              # Only a writable link hands the tools to the agent; through a read-only link the
              # agent can't drive the tool server's writes, so the tool server keeps the finding.
              - if:
                  and:
                    - false: "{link.readonly}"
                    - false: "{$model.technical_assets.{link.source_id}.out_of_scope}"
                    - any:
                        in: "{$model.technical_assets.{link.source_id}.technologies}"
                        true: "{.attributes.ai-agent-orchestrator}"
                  then:
                    - return: true
        - return: false

    # Highest rank (max of C, I, A) among the writable, non-infrastructure targets of a tool server:
    # what an agent that calls it can reach through its tools.
    tool_server_reach:
      parameters:
        - target_id
      do:
        - assign:
            - reach: 0
        - if:
            any:
              in: "{$model.technical_assets.{target_id}.technologies}"
              true: "{.attributes.ai-tool-server}"
            then:
              - loop:
                  in: "{$model.technical_assets.{target_id}.communication_links}"
                  item: tool_link
                  do:
                    - assign:
                        - tool_infra: "is_infra_target({tool_link.target_id})"
                    - if:
                        and:
                          - false: "{tool_link.readonly}"
                          - false: "{tool_infra}"
                        then:
                          - assign:
                              - reached_confidentiality: "{$model.technical_assets.{tool_link.target_id}.confidentiality}"
                              - reached_integrity: "{$model.technical_assets.{tool_link.target_id}.integrity}"
                              - reached_availability: "{$model.technical_assets.{tool_link.target_id}.availability}"
                          - assign:
                              - reached_rank: "cia_rank({reached_confidentiality}, {reached_integrity}, {reached_availability})"
                          - if:
                              greater:
                                first: "{reached_rank}"
                                second: "{reach}"
                              then:
                                - assign:
                                    reach: "{reached_rank}"
        - return: "{reach}"
    # True for a target that is model or operational infrastructure rather than a tool or data
    # asset: an LLM endpoint, model serving, AI gateway, guardrail, AI observability stack, or
    # monitoring. Calls to these are not tool actions and are ignored.
    is_infra_target:
      parameters:
        - target_id
      do:
        - if:
            any:
              in: "{$model.technical_assets.{target_id}.technologies}"
              or:
                - true: "{.attributes.ai-llm-endpoint}"
                - true: "{.attributes.ai-model-serving}"
                - true: "{.attributes.ai-gateway}"
                - true: "{.attributes.ai-guardrails}"
                - true: "{.attributes.ai-observability-stack}"
                - true: "{.attributes.monitoring}"
            then:
              - return: true
        - return: false

    # True when any outgoing link is not marked readonly. readonly: false is the zero value and
    # is dropped on re-serialization, so a missing readonly evaluates false here -- the same
    # behaviour every rule's out_of_scope check already relies on.
    has_writable_link:
      parameters:
        - tech_asset
      do:
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - assign:
                  - infra: "is_infra_target({link.target_id})"
              - if:
                  and:
                    - false: "{link.readonly}"
                    - false: "{infra}"
                  then:
                    - return: true
        - return: false

    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact baseline: medium.
    # Impact: baseline plus the CIA step for the highest rank across the agent, every writable,
    # non-infrastructure tool it calls, and, for a tool server, what that tool server writes to
    # (max of C, I, A).
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - best: "cia_rank({tech_asset.confidentiality}, {tech_asset.integrity}, {tech_asset.availability})"
        - loop:
            in: "{tech_asset.communication_links}"
            item: link
            do:
              - assign:
                  - infra: "is_infra_target({link.target_id})"
              - if:
                  and:
                    - false: "{link.readonly}"
                    - false: "{infra}"
                  then:
                    - assign:
                        - target_confidentiality: "{$model.technical_assets.{link.target_id}.confidentiality}"
                        - target_integrity: "{$model.technical_assets.{link.target_id}.integrity}"
                        - target_availability: "{$model.technical_assets.{link.target_id}.availability}"
                    - assign:
                        - target_rank: "cia_rank({target_confidentiality}, {target_integrity}, {target_availability})"
                    - if:
                        greater:
                          first: "{target_rank}"
                          second: "{best}"
                        then:
                          - assign:
                              best: "{target_rank}"
                    - assign:
                        - through_tools: "tool_server_reach({link.target_id})"
                    - if:
                        greater:
                          first: "{through_tools}"
                          second: "{best}"
                        then:
                          - assign:
                              best: "{through_tools}"
        - return: "adjust_impact_rank(medium, {best})"
