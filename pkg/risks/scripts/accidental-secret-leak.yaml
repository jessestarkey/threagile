id: accidental-secret-leak
title: Accidental Secret Leak
function: operations
stride: information-disclosure
cwe: 200
description: >
  A sourcecode repository or artifact registry can accidentally come to contain secrets -- an API token
  pasted into a commit, a .env file not covered by .gitignore, a private key packaged into a container layer,
  a connection string left in a config file committed "temporarily." Once committed, the secret persists in
  history even after a later commit deletes it, and once published to an artifact registry it persists in
  every pulled layer/version, not just the latest.
impact: >
  If this risk remains unmitigated, anyone with read access to the repository or registry -- including a
  future external contributor, a misconfigured public-read setting, or an attacker who compromises any one
  developer's account -- can recover the secret from history regardless of whether it was ever removed from
  the current tip, and use it to authenticate as whatever system or service it grants access to.
asvs: "V14 - Configuration Verification Requirements"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
action: "Deploy pre-commit secret-scanning to block check-in, and run recurring history-wide scans to catch what pre-commit controls miss or predate."
mitigation: >
  Deploy a pre-commit or pre-push hook (git-secrets, Talisman, gitleaks protect) that blocks a commit
  containing a recognized secret pattern before it ever reaches the remote -- .gitignore/.dockerignore
  alone only prevent accidental inclusion of known file patterns, not a secret pasted directly into tracked
  code. Run a recurring, full-history scan (gitleaks, trufflehog, gitrob) against the repository and against
  built artifact/container layers in the registry, since a pre-commit control only covers commits made after
  it was deployed, not the existing history or artifacts already published. Treat any secret found in
  history as compromised regardless of whether it was later removed -- rotate it, don't just delete the
  line, since the old value remains recoverable from history and from any registry layer that already
  shipped it. Scope CI/CD service-account tokens and API keys narrowly enough that a single leaked credential
  cannot reach beyond the one pipeline or registry it was issued for. References -- CWE-798 (Use of
  Hard-Coded Credentials), CWE-540 (Inclusion of Sensitive Information in Source Code), MITRE ATT&CK
  T1552.001 (Unsecured Credentials -- Credentials In Files), CAPEC-150 (Collect Data from Common Resource
  Locations), OWASP Top 10:2025 A04 (Cryptographic Failures).
check: "Is a pre-commit/pre-push secret-scanning hook deployed, and does a recurring full-history scan cover both the repository and any already-published artifact/container layers in the registry?"
detection_logic: >
  Run a full-history secret scan (gitleaks, trufflehog) against in-scope sourcecode repositories, and scan
  built artifact/container layers in artifact registries for embedded credentials, private keys, or
  connection strings. Audit whether a pre-commit/pre-push hook is actually enforced server-side (a
  client-side-only hook can be bypassed by any contributor who simply doesn't install it).
risk_assessment: >
  High for any repository or registry with no pre-commit scanning and no recurring history-wide scan.
  Critical if a scan confirms a live, unrotated credential already present in history.
false_positives: >
  A confirmed test fixture or example credential that is not valid against any real system, documented as
  such in the scan tool's own allowlist rather than simply ignored.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  data:
    parameter: tech_asset
    title: "get_title({tech_asset})"
    severity: "calculate_severity(unlikely, get_impact({tech_asset}))"
    exploitation_likelihood: unlikely
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                or:
                  - true: "{.attributes.sourcecode-repository}"
                  - true: "{.attributes.artifact-registry}"
          then:
            return: true

  utils:
    get_title:
      parameters:
        - tech_asset
      do:
        - defer:
          - explain: "it is constructed based on technical asset '{tech_asset.id}'"
        - if:
            contains:
              item: git
              in: "{tech_asset.tags}"
            then:
              - return:
                  "<b>Accidental Secret Leak(Git)</b> risk at <b>{tech_asset.title}</b>: <u>Git Leak Prevention</u>"
            else:
              - return:
                  "<b>Accidental Secret Leak</b> risk at <b>{tech_asset.title}</b>"

    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - impact: low
            - highest_confidentiality: "get_highest({tech_asset}, confidentiality)"
            - highest_integrity: "get_highest({tech_asset}, integrity)"
            - highest_availability: "get_highest({tech_asset}, availability)"
        - if:
            or:
              - equal-or-greater:
                  as: confidentiality
                  first: "{highest_confidentiality}"
                  second: confidential
              - equal-or-greater:
                  as: integrity
                  first: "{highest_integrity}"
                  second: critical
              - equal-or-greater:
                  as: availability
                  first: "{highest_availability}"
                  second: critical
            then:
              - assign:
                  impact: medium
        - if:
            or:
              - equal-or-greater:
                  as: confidentiality
                  first: "{highest_confidentiality}"
                  second: strictly-confidential
              - equal-or-greater:
                  as: integrity
                  first: "{highest_integrity}"
                  second: mission-critical
              - equal-or-greater:
                  as: availability
                  first: "{highest_availability}"
                  second: mission-critical
            then:
              - assign:
                  impact: high
        - return: "{impact}"

    get_highest:
      parameters:
        - tech_asset
        - "type"
      do:
        #- defer:
        #    - explain: "the highest {type} value of the technical asset or any data asset processed by it is '{value}'"
        - assign:
            - value: "{tech_asset.{type}}"
        - explain: "{type} value of the technical asset is '{value}'"
        - loop:
            in: "{tech_asset.data_assets_processed}"
            item: data_id
            do:
              if:
                greater:
                  first: "{$model.data_assets.{data_id}.{type}}"
                  second: "{value}"
                  as: "{type}"
                then:
                  - assign:
                      value: "{$model.data_assets.{data_id}.{type}}"
                  - explain: "{type} value of data asset '{data_id}' is '{value}'"
        - return: "{value}"
