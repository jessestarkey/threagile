id: unencrypted-virtual-disk
title: Unencrypted Virtual Disk
function: architecture
stride: information-disclosure
cwe: 311
description: >
  The virtual machine's attached disks are not encrypted at rest, or do not use a FIPS-validated
  cryptographic module.
impact: >
  If this risk remains unmitigated, an attacker or malicious insider who snapshots or detaches
  the disk can read its contents offline.
asvs: "V8 - Data Protection"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
action: "Enable disk encryption at rest."
mitigation: >
  Enforce encryption at rest for all managed disks using platform-managed or customer-managed
  keys stored in a hardware-backed key vault. Reference: DoD Cloud Computing SRG.
check: "Is encryption at rest enabled for this VM's attached disks?"
detection_logic: >
  Audit the disk resource's properties to confirm encryption at rest with a platform- or
  customer-managed key is enabled.
risk_assessment: >
  High risk of offline data exposure.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope virtual-machine
  asset, by design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it
  as mitigated once disk encryption at rest is confirmed enforced with a platform- or
  customer-managed key.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.machine}"
                second: virtual
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Unencrypted Virtual Disk</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "unlikely" (the floor), so only the upward (RAA >= 40) delta is reachable.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            equal-or-greater:
              first: "{tech_asset.raa}"
              second: 40
            then:
              - return: possible
            else:
              - return: unlikely

    # STRIDE is Information-Disclosure -> Confidentiality.
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - cia_rank: low
        - if:
            equal:
              first: "{tech_asset.confidentiality}"
              second: restricted
            then:
              - assign:
                  cia_rank: mid
        - if:
            or:
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: confidential
              - equal:
                  first: "{tech_asset.confidentiality}"
                  second: strictly-confidential
            then:
              - assign:
                  cia_rank: high
        - if:
            equal:
              first: "{cia_rank}"
              second: high
            then:
              - return: high
        - if:
            equal:
              first: "{cia_rank}"
              second: mid
            then:
              - if:
                  true: "{mission_critical}"
                  then:
                    - return: high
                  else:
                    - return: medium
        - if:
            true: "{mission_critical}"
            then:
              - return: medium
            else:
              - return: low
