id: air-ground-station-c2-link-hijack
title: "Air Ground Station Command-Link Hijack and Unencrypted Telemetry/Video Downlink"
function: operations
stride: spoofing
finding_class: control-not-evidenced
cwe: 306
description: >
  An air vehicle's command-and-control link is commonly line-of-sight RF, which far less
  sophisticated equipment can attack than a satellite uplink would require. An unauthenticated
  command link lets an adversary take direct control of the air vehicle. Additionally, an
  unencrypted sensor or video downlink discloses everything the vehicle observes to anyone within
  radio range, as documented real-world interceptions of unencrypted drone video feeds show.
impact: >
  If this risk remains unmitigated, an adversary within radio range can either hijack command of the
  air vehicle outright, or passively intercept its full sensor and video feed. Neither requires more
  than commodity RF equipment against an unauthenticated or unencrypted link.
asvs: "V9 - Communications"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html"
action: 'Authenticate the command-and-control link cryptographically, and encrypt the telemetry, sensor, and video downlink, rather than relying on frequency-hopping or protocol obscurity alone.'
mitigation: >-
  Authenticate every command sent over the control link cryptographically, so that the air vehicle
  can distinguish its legitimate ground control station from an impersonator, rather than relying on
  frequency-hopping, proprietary protocols, or physical proximity as the control.

  Encrypt the telemetry, sensor, and video downlink end to end, since adversaries have intercepted
  unencrypted full-motion video in documented real-world incidents, and the same exposure applies to
  any unencrypted downlink regardless of platform.

  Define and test a documented lost-link failsafe behavior (for example, return to home or a
  controlled landing), so that a jammed or severed link does not itself become the attack.
references: >-
  CWE-306 (Missing Authentication for Critical Function); CWE-319 (Cleartext Transmission of
  Sensitive Information); NIST SP 800-53 SC-8 (Transmission Confidentiality and Integrity) and
  IA-3 (Device Identification and Authentication); DoD UAS cybersecurity guidance
check: 'Is the command-and-control link cryptographically authenticated, is the telemetry, sensor, and video downlink encrypted end to end, and is a documented lost-link failsafe behavior defined and tested?'
detection_logic: >
  Audit the command-link protocol for cryptographic authentication, as opposed to reliance on
  frequency-hopping or obscurity alone. Additionally, confirm that the telemetry, sensor, and video
  downlink is encrypted end to end. Finally, review the documentation and test records for the
  lost-link failsafe behavior.
risk_assessment: >
  Critical for any air ground station whose command link is not cryptographically authenticated, or
  whose sensor or video downlink is unencrypted.
false_positives: >
  This rule fires on every in-scope air ground station asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once command-link authentication and downlink encryption are confirmed.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.air-ground-station}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Air Ground Station Command-Link Hijack and Unencrypted Telemetry/Video Downlink</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: possible baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(possible, {tech_asset.raa})"

    # Impact: medium baseline plus the CIA step on I (STRIDE spoofing).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(medium, {tech_asset.integrity})"
