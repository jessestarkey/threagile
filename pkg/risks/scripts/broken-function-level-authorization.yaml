id: broken-function-level-authorization
title: Broken Function-Level Authorization (BFLA)
function: architecture
stride: elevation-of-privilege
finding_class: control-not-evidenced
cwe: 285
description: >
  The backend API exposes administrative or privileged function endpoints that rely on
  client-supplied role claims or obscurity, rather than on server-side role verification.
impact: >
  If this risk remains unmitigated, a low-privilege authenticated user who discovers an admin
  endpoint can invoke privileged functions without triggering an authorization error.
asvs: "V4 - Access Control"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
action: 'Enforce server-side role verification on every API endpoint, including administrative and internal endpoints, regardless of whether they are documented or discoverable.'
mitigation: >-
  Implement server-side role-based access control (RBAC) on every API endpoint, and never rely on
  client-supplied role claims, obscure URLs, or UI visibility controls as an authorization boundary.

  Apply deny by default, and enforce endpoint-level authorization in a centralized middleware layer
  rather than in individual controller logic.

  Include BFLA test cases in the automated API test suite.
references: >-
  OWASP API Security Top 10 API5:2023; NIST SP 800-53 AC-3 (Access Enforcement) and AC-6 (Least
  Privilege)
check: 'Does a centralized authorization middleware enforce server-side role verification on every API endpoint, including undocumented or administrative ones?'
detection_logic: >
  Include cross-role endpoint access tests in the automated API test suite. Additionally, run DAST
  tools configured to replay requests with downgraded role tokens against every discovered endpoint.
  Finally, monitor the API access logs for low-privilege tokens that access endpoints in
  administrative URL namespaces.
risk_assessment: >
  High for an API with administrative endpoints. However, the finding rises to Critical if the
  administrative endpoints are unauthenticated, or accessible without any privilege check.
false_positives: >
  This rule fires on every in-scope request-serving API asset by design, so no tag suppresses it.
  Instead, dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated
  once every API endpoint is confirmed to enforce server-side role verification through a
  centralized authorization middleware.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.request_serving_api}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Broken Function-Level Authorization (BFLA)</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: probable
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA step.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset.raa})"

    # Impact: high baseline plus the CIA step on max(C,I,A) (STRIDE elevation-of-privilege).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(high, {tech_asset.confidentiality}, {tech_asset.integrity}, {tech_asset.availability})"
