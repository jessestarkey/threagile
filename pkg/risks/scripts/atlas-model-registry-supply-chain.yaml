id: atlas-model-registry-supply-chain
title: "ATLAS: AI Model Registry Supply Chain and Reputation Attack"
function: architecture
stride: tampering
cwe: 1357
description: >
  The model registry or artifact store is a centralized supply chain chokepoint that can be used
  to publish malware-embedded models, replace a trusted model version, or inflate reputation
  metrics.
impact: >
  If this risk remains unmitigated, a malicious model artifact deployed via the registry can
  achieve remote code execution on the serving infrastructure.
asvs: "V14 - Configuration"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
action: "Enforce cryptographic signing and digest pinning for all model artifacts in the registry."
mitigation: >
  Require cryptographic signing (e.g., Sigstore/Cosign) for all model artifacts published to the
  registry. Enforce digest pinning -- reject any artifact without a pinned SHA-256 hash in the
  pipeline manifest. Prohibit Pickle-format artifacts; require safetensors. Mirror all approved
  external artifacts to a private, access-controlled internal registry. Implement write-protect
  on production artifact versions to prevent rug pulls. Monitor public hub reputation metrics for
  registered models. References: MITRE ATLAS AML.T0010 (AI Supply Chain Compromise), AML.T0011
  (Unsafe AI Artifacts / Malicious Package), AML.T0058 (Publish Poisoned Models), AML.T0109 (AI
  Supply Chain Rug Pull), AML.T0111 (AI Supply Chain Reputation Inflation); NIST AI RMF GOVERN
  1.6.
check: "Does the registry require cryptographic signing and digest pinning for every published model artifact, with write-protection on production versions?"
detection_logic: >
  Verify cryptographic signatures and digest hashes for all artifacts at pull time in the CI/CD
  pipeline. Alert on unsigned or hash-mismatched artifact downloads. Monitor for anomalous
  modifications to published artifact versions (rug pull detection). Run picklescan on any
  non-safetensors artifact before staging.
risk_assessment: >
  Critical for registries that serve production model artifacts without cryptographic
  verification.
false_positives: >
  Not applicable via tag (this rule fires unconditionally for every in-scope model-registry
  asset, by design). Dispose of a confirmed-compliant asset through risk_tracking instead: log it
  as mitigated once the registry is confirmed to serve only internally trained models in
  safetensors format with all writes requiring privileged CI/CD service account authentication.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - any:
                in: "{tech_asset.technologies}"
                true: "{.attributes.model-registry}"
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>ATLAS: AI Model Registry Supply Chain and Reputation Attack</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Baseline is "unlikely" (the floor), so only the upward (RAA >= 40) delta is reachable.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - if:
            equal-or-greater:
              first: "{tech_asset.raa}"
              second: 40
            then:
              - return: possible
            else:
              - return: unlikely

    # STRIDE is Tampering -> Integrity. Baseline is "very-high" (the ceiling), so only the
    # downward (Integrity low) delta is reachable.
    get_impact:
      parameters:
        - tech_asset
      do:
        - assign:
            - mission_critical: false
        - if:
            or:
              - equal:
                  first: "{$model.business_criticality}"
                  second: critical
              - equal:
                  first: "{$model.business_criticality}"
                  second: mission-critical
            then:
              - assign:
                  mission_critical: true
        - assign:
            - integrity_low: true
        - if:
            or:
              - equal:
                  first: "{tech_asset.integrity}"
                  second: important
              - equal:
                  first: "{tech_asset.integrity}"
                  second: critical
              - equal:
                  first: "{tech_asset.integrity}"
                  second: mission-critical
            then:
              - assign:
                  integrity_low: false
        - if:
            and:
              - true: "{integrity_low}"
              - false: "{mission_critical}"
            then:
              - return: high
            else:
              - return: very-high
