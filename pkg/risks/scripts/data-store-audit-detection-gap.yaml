id: data-store-audit-detection-gap
title: Data Store Audit Logging and Anomalous Access Detection Gap
function: operations
stride: repudiation
finding_class: control-not-evidenced
cwe: 778
description: >
  A data store has no operation-level audit logging, and no detection tuned to abnormal access
  patterns, such as bulk reads or connections from an unexpected principal.
impact: >
  If this risk remains unmitigated, bulk exfiltration by a compromised or malicious authorized
  identity produces no anomalous signal and no forensic record.
asvs: "V7 - Error Handling and Logging"
cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html"
action: 'Enable operation-level (read, write, delete, and list) audit logging on the data store, with the requesting identity attached, and apply anomaly detection tuned to bulk-read and abnormal-export patterns.'
mitigation: >-
  Enable data-plane audit logging on the store (for example, Azure SQL Auditing, Storage Analytics
  logging, or Key Vault diagnostic logs) that captures the operation, the requesting identity, and
  the affected object or record, and forward it to the central SIEM.

  Layer native or platform-provided anomaly detection (for example, Microsoft Defender for Storage
  or for SQL) tuned to flag bulk-read volume, access from a principal or location outside the
  established baseline, and spikes in the access rate.

  Detection tooling that covers only control-plane (management API) operations, rather than
  data-plane operations, does not meet this control.
references: >-
  NIST SP 800-53 AU-2 (Event Logging), AU-6 (Audit Record Review, Analysis, and Reporting), and
  SI-4 (System Monitoring)
check: 'Is operation-level, data-plane audit logging enabled and forwarded to the SIEM, with anomaly detection tuned to bulk access patterns confirmed active for this asset?'
detection_logic: >
  Alert when the read or export volume from a single identity exceeds a rolling baseline by a
  defined multiple within a one-hour window. Additionally, alert on any data-plane access from a
  principal or network location not previously observed for this asset.
risk_assessment: >
  High for any data store that holds CUI, where data-plane operations are not logged at the record
  or object level, or where no anomaly detection is applied to access patterns.
false_positives: >
  This rule fires on every in-scope datastore asset by design, so no tag suppresses it. Instead,
  dispose of a confirmed-compliant asset through risk_tracking, logging it as mitigated once
  operation-level, data-plane audit logging and tuned anomaly detection are confirmed active for
  this asset.

risk:
  id:
    parameter: tech_asset
    id: "{$risk.id}@{tech_asset.id}"

  match:
    parameter: tech_asset
    do:
      - if:
          and:
            - false: "{tech_asset.out_of_scope}"
            - equal:
                first: "{tech_asset.type}"
                second: datastore
          then:
            return: true

  data:
    parameter: tech_asset
    title: "<b>Data Store Audit Logging and Anomalous Access Detection Gap</b> risk at <b>{tech_asset.title}</b>"
    severity: "calculate_severity(get_likelihood({tech_asset}), get_impact({tech_asset}))"
    exploitation_likelihood: "get_likelihood({tech_asset})"
    exploitation_impact: "get_impact({tech_asset})"
    data_breach_probability: possible
    data_breach_technical_assets:
      - "{tech_asset.id}"
    most_relevant_technical_asset: "{tech_asset.id}"

  utils:
    # Likelihood: likely baseline plus the RAA and internet steps.
    get_likelihood:
      parameters:
        - tech_asset
      do:
        - return: "adjust_likelihood(likely, {tech_asset})"

    # Impact: low baseline plus the CIA step on I (STRIDE repudiation).
    get_impact:
      parameters:
        - tech_asset
      do:
        - return: "adjust_impact(low, {tech_asset.integrity})"
