name: Build, Scan and Publish Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Scheduled builds skip the cache so they pick up patched Alpine packages
      - name: Build the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          no-cache: ${{ github.event_name == 'schedule' }}
          push: false
          load: true

      - name: Scan image
        uses: anchore/scan-action@v5
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Upload Anchore Scan Report
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the image that was scanned above rather than building it again
      - name: Publish image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"
