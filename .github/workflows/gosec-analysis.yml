name: Security Static Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 1 * *'

jobs:
  analyze:
    name: GoSec
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run Gosec
        uses: securego/gosec@v2.30.0
        with:
          args: ./...
