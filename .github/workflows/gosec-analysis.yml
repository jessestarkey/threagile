name: Security Static Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 1 * *'

jobs:
  analyze:
    name: GoSec
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Built with the Go version go.mod requires, since a gosec binary built with an older Go
      # cannot type-check this module and skips most of its analysis
      - name: Run Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 ./...
